    });
    if (sanidade) {
      sanidade.meta.farmacos.forEach((f) => {
        const k = normKey(f);
        if (!map.has(k)) map.set(k, f);
      });
    }
    return Array.from(map.entries())
      .map(([key, nome]) => ({ key, nome }))
      .sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR"));
  }, [medicamentos, sanidade]);

  const stats = useMemo(
    () => (selecionado ? computeMedStats(selecionado, lancamentos, sanidade) : null),
    [selecionado, lancamentos, sanidade]
  );

  return (
    <Card style={{ marginBottom: 14 }}>
      <div
        style={{ display: "flex", justifyContent: "space-between", alignItems: "center", cursor: "pointer" }}
        onClick={() => setShow(!show)}
      >
        <div style={{ display: "flex", alignItems: "center", gap: 8, fontWeight: 700, fontSize: 14 }}>
          <Syringe size={16} color="#2E4A2B" /> Relatório por medicamento
        </div>
        {show ? <ChevronUp size={16} color="#9C9A88" /> : <ChevronDown size={16} color="#9C9A88" />}
      </div>

      {show && (
        <div style={{ marginTop: 12, paddingTop: 12, borderTop: "1px solid #EDEBDD" }}>
          <Field label="Medicamento">
            <Select value={selecionado} onChange={(e) => setSelecionado(e.target.value)}>
              <option value="">Selecione…</option>
              {options.map((o) => (
                <option key={o.key} value={o.key}>
                  {o.nome}
                </option>
              ))}
            </Select>
          </Field>

          {stats && (
            <div style={{ marginTop: 6 }}>
              <div style={{ fontWeight: 800, fontSize: 14, color: "#20241A", marginBottom: 4 }}>
                {stats.total.toLocaleString("pt-BR")} {stats.total === 1 ? "aplicação registrada" : "aplicações registradas"}
              </div>
              {stats.nHist > 0 && (
                <div style={{ fontSize: 11.5, color: "#9C9A88", marginBottom: 8 }}>
                  {stats.nLive.toLocaleString("pt-BR")} lançadas no app · {stats.nHist.toLocaleString("pt-BR")} do histórico importado
                </div>
              )}
              {stats.total === 0 && (
                <div style={{ fontSize: 12.5, color: "#A9A791" }}>Nenhum lançamento encontrado com esse medicamento.</div>
              )}
              <MotivoRows itens={stats.tratamentos} />
              {stats.protocolos.length > 0 && <ProtocoloTitulo />}
              <MotivoRows itens={stats.protocolos} muted />
            </div>
          )}
        </div>
      )}
    </Card>
  );
}

const linkBtnStyle = {
  background: "transparent",
  border: "none",
  color: "#2E4A2B",
  fontWeight: 800,
  fontSize: 12,
  cursor: "pointer",
  padding: "4px 0",
  textDecoration: "underline",
  fontFamily: "inherit",
};

function HistoricoTab({ lancamentos, onDelete, onUpdate, medicamentos, motivos, currais, sanidade, onMarkExported }) {
  const [q, setQ] = useState("");
  const [expanded, setExpanded] = useState(null);
  const [editingId, setEditingId] = useState(null);
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);
  const [startDate, setStartDate] = useState(todayStr());
  const [endDate, setEndDate] = useState(todayStr());
  const [exportMsg, setExportMsg] = useState("");
  const [showExport, setShowExport] = useState(false);
  const [exporting, setExporting] = useState(false);
  const [fallbackCsv, setFallbackCsv] = useState("");
  const [incluirExportados, setIncluirExportados] = useState(false);
  const [marcarAoExportar, setMarcarAoExportar] = useState(true);
  const [filtroExp, setFiltroExp] = useState("todos");
  const [confirmUndo, setConfirmUndo] = useState(false);
  const [confirmMarcar, setConfirmMarcar] = useState(false);

  const inRange = useMemo(() => {
    if (!startDate || !endDate) return [];
    return lancamentos.filter((l) => l.data && l.data >= startDate && l.data <= endDate);
  }, [lancamentos, startDate, endDate]);

  const novosNoPeriodo = useMemo(() => inRange.filter((l) => !l.exportadoEm), [inRange]);
  const jaExportadosNoPeriodo = inRange.length - novosNoPeriodo.length;
  const paraExportar = incluirExportados ? inRange : novosNoPeriodo;
  const totalNovos = useMemo(() => lancamentos.filter((l) => !l.exportadoEm).length, [lancamentos]);
  const ultimaExportacao = useMemo(() => {
    let lote = 0;
    lancamentos.forEach((l) => {
      if (l.exportadoEm && l.exportLote && l.exportLote > lote) lote = l.exportLote;
    });
    if (!lote) return null;
    return { lote, ids: lancamentos.filter((l) => l.exportadoEm && l.exportLote === lote).map((l) => l.id) };
  }, [lancamentos]);

  // Depois de exportar com sucesso, marca os lançamentos novos como "já lançados no sistema".
  // Retorna: null (não exportou/cancelou), 0 (nada a marcar), -1 (falhou ao marcar) ou quantos marcou.
  const concluirExportacao = async (result) => {
    if (!result.ok || result.method === "cancelled") return null;
    if (!marcarAoExportar) return 0;
    const ids = paraExportar.filter((l) => !l.exportadoEm).map((l) => l.id);
    if (!ids.length) return 0;
    const ok = await onMarkExported(ids, Date.now());
    return ok ? ids.length : -1;
  };
  const textoMarcados = (n) =>
    n > 0 ? ` ${n} marcado(s) como já lançado(s) no sistema.` : n === -1 ? " (não consegui marcar como lançados — tente marcar manualmente)." : "";

  const handleExport = async (formato) => {
    if (inRange.length === 0) {
      setExportMsg("Nenhum lançamento encontrado nesse período.");
      return;
    }
    if (paraExportar.length === 0) {
      setExportMsg('Todos os lançamentos desse período já foram exportados. Marque "Incluir também os já exportados" para exportar de novo.');
      return;
    }
    setExportMsg("");
    setFallbackCsv("");
    const linhas = linhasRelatorio(paraExportar);
    setExporting(true);
    const nomeBase = `relatorio_medicacao_${startDate}_a_${endDate}`;
    if (formato === "xlsx") {
      let result;
      try {
        const bytes = montarXlsx(RELATORIO_CABECALHO, linhas, RELATORIO_TIPOS);
        result = await shareOrDownloadBlob(`${nomeBase}.xlsx`, new Blob([bytes], { type: XLSX_MIME }));
      } catch (e) {
        console.error("Erro ao gerar o Excel:", e);
        result = { ok: false };
      }
      const marcados = await concluirExportacao(result);
      setExporting(false);
      setExportMsg(
        result.ok
          ? result.method === "cancelled"
            ? "Envio cancelado — nada foi marcado como exportado."
            : `${paraExportar.length} lançamento(s) exportado(s) em Excel.${textoMarcados(marcados)}`
          : "Não deu para gerar o Excel neste navegador. Use o botão CSV."
      );
      return;
    }
    const lines = [RELATORIO_CABECALHO.join(";")].concat(linhas.map((r) => r.map(csvEscapeSemi).join(";")));
    const csvContent = lines.join("\r\n");
    const result = await shareOrDownloadFile(`${nomeBase}.csv`, csvContent);
    const marcados = await concluirExportacao(result);
    setExporting(false);
    if (result.ok) {
      setExportMsg(
        result.method === "cancelled"
          ? "Envio cancelado — nada foi marcado como exportado."
          : `${paraExportar.length} lançamento(s) exportado(s).${textoMarcados(marcados)}`
      );
    } else {
      setExportMsg("Não deu para baixar automaticamente neste navegador. Copie o texto abaixo (os lançamentos NÃO foram marcados como exportados):");
      setFallbackCsv(csvContent);
    }
  };

  const desfazerUltima = async () => {
    if (!ultimaExportacao) return;
    const n = ultimaExportacao.ids.length;
    const ok = await onMarkExported(ultimaExportacao.ids, null, true);
    setConfirmUndo(false);
    setExportMsg(ok ? `Exportação desfeita: ${n} lançamento(s) voltaram a "novo".` : "Não consegui desfazer. Tente de novo.");
  };
  const marcarPeriodoSemExportar = async () => {
    const ids = novosNoPeriodo.map((l) => l.id);
    const ok = await onMarkExported(ids, Date.now());
    setConfirmMarcar(false);
    setExportMsg(ok ? `${ids.length} lançamento(s) marcados como já lançados no sistema (sem exportar).` : "Não consegui marcar. Tente de novo.");
  };

  const filtered = useMemo(() => {
    const base =
      filtroExp === "novos" ? lancamentos.filter((l) => !l.exportadoEm) : filtroExp === "exportados" ? lancamentos.filter((l) => l.exportadoEm) : lancamentos;
    if (!q.trim()) return base;
    const t = q.trim().toLowerCase();
    return base.filter(
      (l) =>
        l.sisbov?.includes(t) ||
        l.motivo?.toLowerCase().includes(t) ||
        l.responsavel?.toLowerCase().includes(t) ||
        l.medicamentos?.some((m) => m.medicamento.toLowerCase().includes(t))
    );
  }, [lancamentos, q, filtroExp]);

  return (
    <div>
      <QuickAnimalSearch lancamentos={lancamentos} sanidade={sanidade} />
      <MedicamentoReport lancamentos={lancamentos} medicamentos={medicamentos} sanidade={sanidade} />

      <Card style={{ marginBottom: 14 }}>
        <div
          style={{ display: "flex", justifyContent: "space-between", alignItems: "center", cursor: "pointer" }}
          onClick={() => setShowExport(!showExport)}
        >
          <div style={{ display: "flex", alignItems: "center", gap: 8, fontWeight: 700, fontSize: 14 }}>
            <FileDown size={16} color="#2E4A2B" /> Extrair relatório de medicação
          </div>
          {showExport ? <ChevronUp size={16} color="#9C9A88" /> : <ChevronDown size={16} color="#9C9A88" />}
        </div>
        {showExport && (
          <div style={{ marginTop: 12, paddingTop: 12, borderTop: "1px solid #EDEBDD" }}>
            <div style={{ display: "flex", gap: 10 }}>
              <div style={{ flex: 1 }}>
                <Field label="Data inicial">
                  <TextInput type="date" value={startDate} onChange={(e) => setStartDate(e.target.value)} />
                </Field>
              </div>
              <div style={{ flex: 1 }}>
                <Field label="Data final">
                  <TextInput type="date" value={endDate} onChange={(e) => setEndDate(e.target.value)} />
                </Field>
              </div>
            </div>
            <div style={{ fontSize: 12, color: "#6B6A57", marginBottom: 8 }}>
              {inRange.length} no período · <strong>{novosNoPeriodo.length} novo(s)</strong> (ainda não lançados no sistema) · {jaExportadosNoPeriodo} já exportado(s)
            </div>
            <label style={{ display: "flex", alignItems: "flex-start", gap: 8, fontSize: 12.5, color: "#3A3D31", marginBottom: 6 }}>
              <input type="checkbox" checked={marcarAoExportar} onChange={(e) => setMarcarAoExportar(e.target.checked)} style={{ marginTop: 2 }} />
              <span>Marcar como "já lançados no sistema" ao exportar</span>
            </label>
            <label style={{ display: "flex", alignItems: "flex-start", gap: 8, fontSize: 12.5, color: "#3A3D31", marginBottom: 6 }}>
              <input type="checkbox" checked={incluirExportados} onChange={(e) => setIncluirExportados(e.target.checked)} style={{ marginTop: 2 }} />
              <span>Incluir também os já exportados (exportar de novo)</span>
            </label>
            <div style={{ fontSize: 12, color: "#2E4A2B", fontWeight: 700, marginBottom: 10 }}>
              Vai exportar {paraExportar.length} lançamento(s).
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <Btn onClick={() => handleExport("csv")} disabled={exporting} style={{ flex: 1 }}>
                {exporting ? <Loader2 size={15} style={{ animation: "spin 1s linear infinite" }} /> : <FileDown size={15} />}
                {exporting ? "Gerando…" : "Extrair CSV"}
              </Btn>
              <Btn variant="accent" onClick={() => handleExport("xlsx")} disabled={exporting} style={{ flex: 1 }}>
                <FileDown size={15} /> Extrair Excel
              </Btn>
            </div>
            <div style={{ fontSize: 11.5, color: "#9C9A88", marginTop: 6 }}>
              O relatório traz o curral de destino depois da temperatura. No Excel (.xlsx) o SISBOV sai como número inteiro; no CSV ele vai só com dígitos, e o Excel costuma mostrá-lo em notação científica.
            </div>
            <div style={{ borderTop: "1px solid #EDEBDD", marginTop: 12, paddingTop: 8 }}>
              {ultimaExportacao && (
                <div style={{ fontSize: 12, color: "#4A4E3F", marginBottom: 4 }}>
                  Última exportação: <strong>{fmtDateTime(ultimaExportacao.lote)}</strong> ({ultimaExportacao.ids.length} lançamento(s)).{" "}
                  {!confirmUndo ? (
                    <button type="button" onClick={() => setConfirmUndo(true)} style={linkBtnStyle}>
                      Desfazer
                    </button>
                  ) : (
                    <span>
                      Voltar esses {ultimaExportacao.ids.length} para "novo"?{" "}
                      <button type="button" onClick={desfazerUltima} style={{ ...linkBtnStyle, color: "#B5442E" }}>
                        Sim, desfazer
                      </button>{" "}
                      <button type="button" onClick={() => setConfirmUndo(false)} style={linkBtnStyle}>
                        Não
                      </button>
                    </span>
                  )}
                </div>
              )}
              {novosNoPeriodo.length > 0 &&
                (!confirmMarcar ? (
                  <button type="button" onClick={() => setConfirmMarcar(true)} style={linkBtnStyle}>
                    Só marcar os {novosNoPeriodo.length} novos do período como já lançados (sem exportar)
                  </button>
                ) : (
                  <div style={{ fontSize: 12, color: "#4A4E3F" }}>
                    Marcar {novosNoPeriodo.length} lançamento(s) como já lançados no sistema?{" "}
                    <button type="button" onClick={marcarPeriodoSemExportar} style={{ ...linkBtnStyle, color: "#B5442E" }}>
                      Sim, marcar
                    </button>{" "}
                    <button type="button" onClick={() => setConfirmMarcar(false)} style={linkBtnStyle}>
                      Não
                    </button>
                  </div>
                ))}
            </div>
            {exportMsg && (
              <div style={{ fontSize: 12, color: fallbackCsv ? "#B5442E" : "#2E4A2B", marginTop: 8, display: "flex", alignItems: "center", gap: 6 }}>
                {fallbackCsv ? <AlertCircle size={13} /> : <Check size={13} />} {exportMsg}
              </div>
            )}
            {fallbackCsv && (
              <div style={{ marginTop: 8 }}>
                <TextArea
                  readOnly
                  value={fallbackCsv}
                  onFocus={(e) => e.target.select()}
                  style={{ minHeight: 140, fontSize: 11.5, fontFamily: "monospace" }}
                />
                <div style={{ fontSize: 11.5, color: "#9C9A88", marginTop: 4 }}>
                  Toque na caixa acima, selecione tudo e copie — depois cole num app de Notas, WhatsApp ou Excel para salvar.
                </div>
              </div>
            )}
          </div>
        )}
      </Card>

      <div style={{ display: "flex", gap: 6, marginBottom: 10, flexWrap: "wrap" }}>
        {[
          ["todos", `Todos (${lancamentos.length})`],
          ["novos", `Novos (${totalNovos})`],
          ["exportados", `Já exportados (${lancamentos.length - totalNovos})`],
        ].map(([k, rot]) => (
          <button
            key={k}
            type="button"
            onClick={() => setFiltroExp(k)}
            style={{
              background: filtroExp === k ? "#2E4A2B" : "#FFFFFF",
              color: filtroExp === k ? "#F3F4EC" : "#4A4E3F",
              border: "1.5px solid " + (filtroExp === k ? "#2E4A2B" : "#D7D5C4"),
              borderRadius: 999,
              padding: "6px 12px",
              fontSize: 12.5,
              fontWeight: 700,
              cursor: "pointer",
              fontFamily: "inherit",
            }}
          >
            {rot}
          </button>
        ))}
      </div>

      <div style={{ position: "relative", marginBottom: 14 }}>
        <Search size={16} style={{ position: "absolute", left: 12, top: 13, color: "#9C9A88" }} />
        <TextInput
          placeholder="Buscar por SISBOV, motivo, responsável…"
          value={q}
          onChange={(e) => setQ(e.target.value)}
          style={{ paddingLeft: 36 }}
        />
      </div>

      {filtered.length === 0 && (
        <div style={{ textAlign: "center", color: "#9C9A88", padding: "40px 10px", fontSize: 14 }}>
          {lancamentos.length === 0 ? "Nenhum lançamento registrado ainda." : "Nada encontrado para essa busca."}
        </div>
      )}

      {filtered.map((l) => {
        const isOpen = expanded === l.id;
        return (
          <Card key={l.id} style={{ marginBottom: 10 }}>
            <div
              style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", cursor: "pointer" }}
              onClick={() => setExpanded(isOpen ? null : l.id)}
            >
              <div style={{ flex: 1 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6, flexWrap: "wrap" }}>
                  <EarTag>{l.sisbov}</EarTag>
                  <span style={{ fontSize: 12.5, color: "#6B6A57", fontWeight: 700 }}>{l.motivo}</span>
                  <span
                    style={{
                      fontSize: 11,
                      fontWeight: 800,
                      color: l.exportadoEm ? "#2E4A2B" : "#A06A00",
                      background: l.exportadoEm ? "#EAF3DE" : "#FBF3E0",
                      borderRadius: 6,
                      padding: "2px 7px",
                    }}
                  >
                    {l.exportadoEm ? "✓ exportado" : "novo"}
                  </span>
                </div>
                <div style={{ fontSize: 13, color: "#3A3D31" }}>
                  {l.medicamentos?.map((m, i) => (
                    <div key={i}>
                      {m.medicamento} — {m.ml}ml{m.lote ? ` · lote ${m.lote}` : ""}
                    </div>
                  ))}
                </div>
              </div>
              {isOpen ? <ChevronUp size={18} color="#9C9A88" /> : <ChevronDown size={18} color="#9C9A88" />}
            </div>

            {isOpen && editingId === l.id && (
              <EditLancamentoForm
                lancamento={l}
                medicamentos={medicamentos}
                motivos={motivos}
                currais={currais}
                onCancel={() => setEditingId(null)}
                onSave={(patch) => {
                  onUpdate(l.id, patch);
                  setEditingId(null);
                }}
              />
            )}

            {isOpen && editingId !== l.id && (
              <div style={{ marginTop: 12, paddingTop: 12, borderTop: "1px solid #EDEBDD", fontSize: 13, color: "#4A4E3F" }}>
                <Row icon={<Calendar size={14} />} label="Data" value={fmtDate(l.data)} />
                {l.destino && <Row icon={<MapPin size={14} />} label="Destino" value={l.destino} />}
                {l.peso && <Row icon={<Weight size={14} />} label="Peso" value={`${l.peso} kg`} />}
                {l.temperatura && <Row icon={<Thermometer size={14} />} label="Temperatura" value={`${l.temperatura} °C`} />}
                {l.modalidade && <Row icon={<Syringe size={14} />} label="Modalidade" value={l.modalidade} />}
                {l.protocolo && <Row icon={<ClipboardList size={14} />} label="Protocolo" value={l.protocolo} />}
                <Row icon={<User size={14} />} label="Responsável" value={l.responsavel} />
                {l.observacao && <Row icon={<MessageSquare size={14} />} label="Observação" value={l.observacao} />}
                <div style={{ fontSize: 11.5, color: "#A9A791", marginTop: 8 }}>Registrado em {fmtDateTime(l.dataRegistro)}</div>
                <div style={{ fontSize: 11.5, color: l.exportadoEm ? "#2E4A2B" : "#A06A00", marginTop: 4, fontWeight: 700 }}>
                  {l.exportadoEm ? `Exportado em ${fmtDateTime(l.exportadoEm)}` : "Ainda não exportado para o sistema"}
                </div>
                <button
                  type="button"
                  onClick={(e) => {
                    e.stopPropagation();
                    onMarkExported([l.id], l.exportadoEm ? null : Date.now(), true);
                  }}
                  style={linkBtnStyle}
                >
                  {l.exportadoEm ? "Marcar como não exportado" : "Marcar como já exportado"}
                </button>

                {confirmDeleteId !== l.id ? (
                  <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
                    <button
                      onClick={(e) => {
                        e.stopPropagation();
                        setEditingId(l.id);
                      }}
                      style={{
                        background: "transparent",
                        border: "1.5px solid #C8C6B4",
                        color: "#2E4A2B",
                        borderRadius: 8,
                        padding: "7px 12px",
                        fontSize: 12.5,
                        fontWeight: 700,
                        display: "inline-flex",
                        alignItems: "center",
                        gap: 6,
                        cursor: "pointer",
                        fontFamily: "inherit",
                      }}
                    >
                      <Pencil size={14} /> Editar
                    </button>
                    <button
                      onClick={(e) => {
                        e.stopPropagation();
                        setConfirmDeleteId(l.id);
                      }}
                      style={{
                        background: "transparent",
                        border: "1.5px solid #E4C4BC",
                        color: "#B5442E",
                        borderRadius: 8,
                        padding: "7px 12px",
                        fontSize: 12.5,
                        fontWeight: 700,
                        display: "inline-flex",
                        alignItems: "center",
                        gap: 6,
                        cursor: "pointer",
                        fontFamily: "inherit",
                      }}
                    >
                      <Trash2 size={14} /> Remover
                    </button>
                  </div>
                ) : (
                  <div
                    style={{
                      marginTop: 10,
                      padding: "10px 12px",
                      background: "#FBF0EC",
                      border: "1.5px solid #E4C4BC",
                      borderRadius: 10,
                    }}
                  >
                    <div style={{ display: "flex", alignItems: "center", gap: 6, color: "#B5442E", fontSize: 12.5, fontWeight: 700, marginBottom: 8 }}>
                      <AlertCircle size={14} /> Remover este lançamento? Não dá para desfazer.
                    </div>
                    <div style={{ display: "flex", gap: 8 }}>
                      <Btn
                        variant="danger"
                        style={{ flex: 1, borderColor: "#B5442E", background: "#B5442E", color: "#fff" }}
                        onClick={(e) => {
                          e.stopPropagation();
                          onDelete(l.id);
                          setConfirmDeleteId(null);
                        }}
                      >
                        <Trash2 size={14} /> Sim, remover
                      </Btn>
                      <Btn
                        variant="ghost"
                        onClick={(e) => {
                          e.stopPropagation();
                          setConfirmDeleteId(null);
                        }}
                      >
                        Cancelar
                      </Btn>
                    </div>
                  </div>
                )}
              </div>
            )}
          </Card>
        );
      })}
    </div>
  );
}

function Row({ icon, label, value }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
      <span style={{ color: "#9C9A88" }}>{icon}</span>
      <span style={{ color: "#8B8A78", minWidth: 88 }}>{label}</span>
      <span style={{ fontWeight: 600 }}>{value}</span>
    </div>
  );
}

function Chip({ children, onRemove }) {
  return (
    <span
      style={{
        display: "inline-flex",
        alignItems: "center",
        gap: 6,
        background: "#EDEBDD",
        color: "#3A3D31",
        borderRadius: 8,
        padding: "6px 8px 6px 10px",
        fontSize: 13,
        fontWeight: 600,
        marginRight: 6,
        marginBottom: 6,
      }}
    >
      {children}
      {onRemove && (
        <button onClick={onRemove} aria-label="Remover" style={{ background: "transparent", border: "none", color: "#9C9A88", cursor: "pointer", display: "flex" }}>
          <X size={13} />
        </button>
      )}
    </span>
  );
}

function AddRow({ placeholder, onAdd }) {
  const [v, setV] = useState("");
  return (
    <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
      <TextInput
        placeholder={placeholder}
        value={v}
        onChange={(e) => setV(e.target.value)}
        onKeyDown={(e) => {
          if (e.key === "Enter" && v.trim()) {
            onAdd(v);
            setV("");
          }
        }}
      />
      <Btn
        variant="accent"
        onClick={() => {
          if (v.trim()) {
            onAdd(v);
            setV("");
          }
        }}
      >
        <Plus size={16} />
      </Btn>
    </div>
  );
}

function fonteTexto(f) {
  if (!f) return "";
  if (f.origem === "aparelho") return `Fonte: arquivo carregado neste aparelho (${f.arquivo})`;
  return `Fonte: ${f.arquivo} do site · ${mb(f.bytes || 0)} MB`;
}

function BancoLinha({ titulo, resumo, atualizado, erro, loading, fonte, tentativas }) {
  return (
    <div style={{ padding: "8px 0", borderBottom: "1px solid #EDEBDD" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8 }}>
        <span style={{ fontWeight: 700, fontSize: 14 }}>{titulo}</span>
        {loading && <Loader2 size={14} style={{ animation: "spin 1s linear infinite" }} />}
      </div>
      {erro ? (
        <div style={{ display: "flex", alignItems: "flex-start", gap: 6, color: "#B5442E", fontSize: 12.5, marginTop: 2 }}>
          <AlertCircle size={14} /> <span>{erro}</span>
        </div>
      ) : (
        <>
          <div style={{ fontSize: 12.5, color: "#3A3D31" }}>{resumo || (loading ? "Carregando…" : "—")}</div>
          {atualizado && <div style={{ fontSize: 11.5, color: "#9C9A88" }}>Atualizado em {fmtDateTime(atualizado)}</div>}
        </>
      )}
      {fonte && <div style={{ fontSize: 11, color: "#A9A791" }}>{fonte}</div>}
      {tentativas && tentativas.length > 0 && (
        <details open={!!erro} style={{ marginTop: 4 }}>
          <summary style={{ fontSize: 11.5, color: "#6B6A57", cursor: "pointer", fontWeight: 700 }}>Detalhes da busca</summary>
          {tentativas.map((t, i) => (
            <div key={i} style={{ fontSize: 11.5, color: "#6B6A57", wordBreak: "break-word" }}>
              {t.arquivo} → {t.resultado}
            </div>
          ))}
        </details>
      )}
    </div>
  );
}

function CadastrosTab({
  medicamentos,
  motivos,
  currais,
  addMedicamento,
  removeMedicamento,
  addLote,
  removeLote,
  addMotivo,
  removeMotivo,
  addCurral,
  removeCurral,
  animaisCount,
  animaisUpdatedAt,
  sanidade,
  datasetsLoading,
  datasetsStatus,
  datasetErrors,
  datasetInfo,
  onReloadDatasets,
  onLoadLocalFiles,
  onClearLocalFiles,
  usuarios,
  addUsuario,
  removeUsuario,
}) {
  const [openMed, setOpenMed] = useState(null);
  const [showMedList, setShowMedList] = useState(false);
  const [showMotivosList, setShowMotivosList] = useState(false);
  const [novoUsuarioNome, setNovoUsuarioNome] = useState("");
  const [novoUsuarioSenha, setNovoUsuarioSenha] = useState("");
  const [usuarioError, setUsuarioError] = useState("");
  const localInputRef = React.useRef(null);

  const handleAddUsuario = () => {
    setUsuarioError("");
    const nome = novoUsuarioNome.trim();
    const senha = novoUsuarioSenha.replace(/\D/g, "");
    if (!nome) {
      setUsuarioError("Digite o nome do responsável.");
      return;
    }
    if (senha.length < 4) {
      setUsuarioError("A senha precisa ter pelo menos 4 números.");
      return;
    }
    addUsuario(nome, senha);
    setNovoUsuarioNome("");
    setNovoUsuarioSenha("");
  };

  return (
    <div>
      <SectionTitle>Medicamentos e lotes</SectionTitle>
      <AddRow placeholder="Nome do medicamento" onAdd={addMedicamento} />
      {medicamentos.length === 0 && <EmptyHint>Nenhum medicamento cadastrado.</EmptyHint>}
      {medicamentos.length > 0 && (
        <button
          onClick={() => setShowMedList(!showMedList)}
          style={{
            display: "flex",
            alignItems: "center",
            justifyContent: "space-between",
            width: "100%",
            boxSizing: "border-box",
            background: "#FFFFFF",
            border: "1px solid #E3E1D3",
            borderRadius: 10,
            padding: "10px 12px",
            marginBottom: 8,
            cursor: "pointer",
            fontFamily: "inherit",
          }}
        >
          <span style={{ fontWeight: 700, fontSize: 14, color: "#20241A" }}>{medicamentos.length} medicamento(s) cadastrado(s)</span>
          <span style={{ display: "flex", alignItems: "center", gap: 6, color: "#6B6A57", fontSize: 12.5, fontWeight: 700 }}>
            {showMedList ? "ocultar" : "ver lista"}
            {showMedList ? <ChevronUp size={16} color="#9C9A88" /> : <ChevronDown size={16} color="#9C9A88" />}
          </span>
        </button>
      )}
      {showMedList &&
        medicamentos.map((m) => (
        <Card key={m.nome} style={{ marginBottom: 8, padding: "10px 12px" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", cursor: "pointer" }} onClick={() => setOpenMed(openMed === m.nome ? null : m.nome)}>
            <div style={{ fontWeight: 700, fontSize: 14 }}>{m.nome}</div>
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <span style={{ fontSize: 12, color: "#9C9A88" }}>{m.lotes.length} lote(s)</span>
              {openMed === m.nome ? <ChevronUp size={16} color="#9C9A88" /> : <ChevronDown size={16} color="#9C9A88" />}
            </div>
          </div>
          {openMed === m.nome && (
            <div style={{ marginTop: 10, paddingTop: 10, borderTop: "1px solid #EDEBDD" }}>
              <div style={{ marginBottom: 8 }}>
                {m.lotes.map((l) => (
                  <Chip key={l} onRemove={() => removeLote(m.nome, l)}>
                    {l}
                  </Chip>
                ))}
                {m.lotes.length === 0 && <span style={{ fontSize: 12.5, color: "#A9A791" }}>Sem lotes ainda.</span>}
              </div>
              <AddRow placeholder="Novo lote" onAdd={(v) => addLote(m.nome, v)} />
              <button
                onClick={() => removeMedicamento(m.nome)}
                style={{ background: "transparent", border: "none", color: "#B5442E", fontSize: 12.5, fontWeight: 700, cursor: "pointer", padding: 0, fontFamily: "inherit" }}
              >
                Remover medicamento
              </button>
            </div>
          )}
        </Card>
      ))}

      <SectionTitle>Motivos</SectionTitle>
      <AddRow placeholder="Novo motivo" onAdd={addMotivo} />
      {motivos.length === 0 && <EmptyHint>Nenhum motivo cadastrado.</EmptyHint>}
      {motivos.length > 0 && (
        <button
          onClick={() => setShowMotivosList(!showMotivosList)}
          style={{
            display: "flex",
            alignItems: "center",
            justifyContent: "space-between",
            width: "100%",
            boxSizing: "border-box",
            background: "#FFFFFF",
            border: "1px solid #E3E1D3",
            borderRadius: 10,
            padding: "10px 12px",
            marginBottom: 10,
            cursor: "pointer",
            fontFamily: "inherit",
          }}
        >
          <span style={{ fontWeight: 700, fontSize: 14, color: "#20241A" }}>{motivos.length} motivo(s) cadastrado(s)</span>
          <span style={{ display: "flex", alignItems: "center", gap: 6, color: "#6B6A57", fontSize: 12.5, fontWeight: 700 }}>
            {showMotivosList ? "ocultar" : "ver lista"}
            {showMotivosList ? <ChevronUp size={16} color="#9C9A88" /> : <ChevronDown size={16} color="#9C9A88" />}
          </span>
        </button>
      )}
      {showMotivosList && (
        <div style={{ marginBottom: 10 }}>
          {motivos.map((m) => (
            <Chip key={m} onRemove={() => removeMotivo(m)}>
              {m}
            </Chip>
          ))}
        </div>
      )}

      <SectionTitle>Currais de destino</SectionTitle>
      <AddRow placeholder="Novo curral" onAdd={addCurral} />
      <div>
        {currais.map((c) => (
          <Chip key={c} onRemove={() => removeCurral(c)}>
            {c}
          </Chip>
        ))}
        {currais.length === 0 && <EmptyHint>Nenhum curral cadastrado.</EmptyHint>}
      </div>

      <SectionTitle>Banco de dados (arquivos do site)</SectionTitle>
      <Card style={{ marginBottom: 8 }}>
        <BancoLinha
          titulo="Animais (SISBOV)"
          loading={datasetsLoading}
          erro={datasetErrors && datasetErrors.animais}
          resumo={animaisCount > 0 ? `${animaisCount.toLocaleString("pt-BR")} animais` : ""}
          atualizado={animaisUpdatedAt}
          fonte={fonteTexto(datasetInfo && datasetInfo.fontes && datasetInfo.fontes.animais)}
          tentativas={datasetInfo && datasetInfo.diag && datasetInfo.diag.animais}
        />
        <BancoLinha
          titulo="Histórico de sanidade"
          loading={datasetsLoading}
          erro={datasetErrors && datasetErrors.sanidade}
          resumo={
            sanidade && sanidade.meta
              ? `${sanidade.meta.events.toLocaleString("pt-BR")} eventos em ${sanidade.meta.animals.toLocaleString("pt-BR")} animais · de ${fmtDate(dayToIso(sanidade.meta.dayMin))} a ${fmtDate(dayToIso(sanidade.meta.dayMax))}`
              : ""
          }
          atualizado={sanidade && sanidade.meta ? sanidade.meta.updatedAt : null}
          fonte={fonteTexto(datasetInfo && datasetInfo.fontes && datasetInfo.fontes.sanidade)}
          tentativas={datasetInfo && datasetInfo.diag && datasetInfo.diag.sanidade}
        />
        {datasetsLoading && datasetsStatus && <div style={{ fontSize: 12, color: "#6B6A57", fontWeight: 700, marginTop: 8 }}>{datasetsStatus}</div>}
        {datasetInfo && datasetInfo.contexto && datasetInfo.contexto.protocolo === "file:" && (
          <div style={{ fontSize: 12, color: "#B5442E", fontWeight: 700, marginTop: 8 }}>
            O app foi aberto direto do arquivo (file://). Abra pelo endereço do site no Render — assim não dá para baixar o banco.
          </div>
        )}
        {datasetInfo && datasetInfo.contexto && (
          <div style={{ fontSize: 11, color: "#A9A791", marginTop: 8, wordBreak: "break-all" }}>
            Endereço do app: {datasetInfo.contexto.origem || "—"} · manifest.json: {datasetInfo.contexto.manifest} · Internet do aparelho: {datasetInfo.contexto.online === false ? "desligada" : "ligada"}
          </div>
        )}
        {datasetInfo && datasetInfo.offline && (
          <div style={{ fontSize: 12, color: "#B5442E", fontWeight: 700, marginTop: 8 }}>Sem conexão com o site: usando os dados guardados neste aparelho.</div>
        )}
        {datasetErrors && datasetErrors.geral && (
          <div style={{ display: "flex", alignItems: "center", gap: 6, color: "#B5442E", fontSize: 12.5, marginTop: 8 }}>
            <AlertCircle size={14} /> {datasetErrors.geral}
          </div>
        )}
        <Btn variant="accent" onClick={onReloadDatasets} disabled={datasetsLoading} style={{ width: "100%", marginTop: 12 }}>
          {datasetsLoading ? <Loader2 size={15} style={{ animation: "spin 1s linear infinite" }} /> : <RefreshCw size={15} />}
          {datasetsLoading ? "Carregando…" : "Recarregar dados agora"}
        </Btn>
        <details style={{ marginTop: 10 }}>
          <summary style={{ fontSize: 12.5, color: "#2E4A2B", cursor: "pointer", fontWeight: 800 }}>Como atualizar o banco de dados</summary>
          <div style={{ fontSize: 12, color: "#4A4E3F", marginTop: 6, lineHeight: 1.5 }}>
            1. Se o arquivo for grande, compacte: botão direito no arquivo → Enviar para → Pasta compactada (fica <strong>sanidade.zip</strong> e <strong>ANIMAIS_APK.zip</strong>, bem menores).
            <br />2. No GitHub: Add file → Upload files → envie o .zip (ou o .csv) → Commit changes.
            <br />3. Espere o Render publicar (no Render, aba Events: "Deploy live").
            <br />4. Aqui, toque em <strong>Recarregar dados agora</strong>.
            <br />Se algo falhar, abra "Detalhes da busca" acima: ele mostra o que o app encontrou em cada nome de arquivo.
          </div>
        </details>
        <div style={{ borderTop: "1px solid #EDEBDD", marginTop: 12, paddingTop: 12 }}>
          <input
            ref={localInputRef}
            type="file"
            multiple
            accept=".csv,.zip,text/csv,application/zip,application/x-zip-compressed"
            onChange={(e) => {
              onLoadLocalFiles(e.target.files);
              e.target.value = "";
            }}
            style={{ display: "none" }}
          />
          <Btn variant="ghost" onClick={() => localInputRef.current && localInputRef.current.click()} disabled={datasetsLoading} style={{ width: "100%" }}>
            <FileUp size={15} /> Plano B: carregar arquivo deste aparelho
          </Btn>
          <div style={{ fontSize: 11.5, color: "#9C9A88", marginTop: 6, textAlign: "center" }}>
            Escolha o ANIMAIS_APK e/ou a sanidade (.csv ou .zip) direto do celular/computador. Vale só para este aparelho, não vai para o GitHub nem para a nuvem, e o app reconhece sozinho qual é qual.
          </div>
          {datasetInfo && datasetInfo.fontes && (datasetInfo.fontes.animais?.origem === "aparelho" || datasetInfo.fontes.sanidade?.origem === "aparelho") && (
            <button
              type="button"
              onClick={onClearLocalFiles}
              style={{ background: "transparent", border: "none", color: "#B5442E", fontWeight: 800, fontSize: 12.5, cursor: "pointer", padding: "8px 0 0", width: "100%", fontFamily: "inherit" }}
            >
              Voltar a usar só os arquivos do site
            </button>
          )}
        </div>
      </Card>

      <SectionTitle>Usuários responsáveis</SectionTitle>
      <Card style={{ marginBottom: 8 }}>
        <div style={{ fontSize: 12.5, color: "#6B6A57", marginBottom: 10 }}>
          Cadastre uma senha numérica para cada funcionário. Ao abrir o app, ele escolhe o nome e digita a senha — o campo "Responsável" já vem preenchido sozinho.
        </div>
        {usuarios.length === 0 && <EmptyHint>Nenhum usuário cadastrado ainda.</EmptyHint>}
        {usuarios.map((u) => (
          <div
            key={u.nome}
            style={{
              display: "flex",
              alignItems: "center",
              justifyContent: "space-between",
              padding: "8px 0",
              borderBottom: "1px solid #EDEBDD",
            }}
          >
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <UserCircle2 size={16} color="#2E4A2B" />
              <span style={{ fontWeight: 700, fontSize: 13.5 }}>{u.nome}</span>
              <span style={{ fontSize: 12, color: "#A9A791", letterSpacing: "0.15em" }}>••••</span>
            </div>
            <button
              onClick={() => removeUsuario(u.nome)}
              aria-label="Remover usuário"
              style={{ background: "transparent", border: "none", color: "#B5442E", cursor: "pointer" }}
            >
              <Trash2 size={15} />
            </button>
          </div>
        ))}

        <div style={{ marginTop: 12, paddingTop: 12, borderTop: usuarios.length ? "none" : "1px solid #EDEBDD" }}>
          <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
            <div style={{ flex: 1.3 }}>
              <TextInput placeholder="Nome" value={novoUsuarioNome} onChange={(e) => setNovoUsuarioNome(e.target.value)} />
            </div>
            <div style={{ flex: 1 }}>
              <TextInput
                inputMode="numeric"
                type="password"
                placeholder="Senha"
                value={novoUsuarioSenha}
                onChange={(e) => setNovoUsuarioSenha(e.target.value.replace(/\D/g, ""))}
              />
            </div>
          </div>
          {usuarioError && (
            <div style={{ display: "flex", alignItems: "center", gap: 6, color: "#B5442E", fontSize: 12.5, marginBottom: 8 }}>
              <AlertCircle size={14} /> {usuarioError}
            </div>
          )}
          <Btn variant="accent" onClick={handleAddUsuario} style={{ width: "100%" }}>
            <Plus size={15} /> Cadastrar usuário
          </Btn>
        </div>
      </Card>

      <div style={{ marginTop: 24, padding: "12px 14px", background: "#EDEBDD", borderRadius: 10, fontSize: 12.5, color: "#6B6A57" }}>
        Esses cadastros ficam salvos na nuvem e valem para todos que usam este app. Cadastre aqui os medicamentos, lotes, motivos e currais antes de começar a lançar.
      </div>
    </div>
  );
}

function EmptyHint({ children }) {
  return <div style={{ fontSize: 12.5, color: "#A9A791", marginBottom: 12 }}>{children}</div>;
}

// ---------- Inicialização ----------
function ErroConexao({ mensagem }) {
  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", height: "100vh", gap: 10, fontFamily: "system-ui, -apple-system, sans-serif", color: "#B5442E", textAlign: "center", padding: 20 }}>
      <div>Não foi possível conectar ao Firebase. Recarregue a página.</div>
      {mensagem && <div style={{ fontSize: 12, color: "#9C9A88", maxWidth: 340 }}>{mensagem}</div>}
    </div>
  );
}

function ConfigPendente() {
  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", height: "100vh", gap: 10, fontFamily: "system-ui, -apple-system, sans-serif", color: "#6B6A57", textAlign: "center", padding: 24 }}>
      <div style={{ fontWeight: 800, fontSize: 16, color: "#20241A" }}>Configuração do Firebase pendente</div>
      <div style={{ fontSize: 13.5, maxWidth: 360 }}>
        Edite este arquivo e preencha o objeto <code>firebaseConfig</code>, perto do topo do
        script, com os valores do seu projeto Firebase. Veja o passo a passo no README.md.
      </div>
    </div>
  );
}

(async function init() {
  const root = ReactDOM.createRoot(document.getElementById("root"));
  if (!firebaseConfig.apiKey || firebaseConfig.apiKey.indexOf("COLE_AQUI") !== -1) {
    root.render(<ConfigPendente />);
    return;
  }
  try {
    firebase.initializeApp(firebaseConfig);
    // Login anônimo: exige apenas que "Anonymous" esteja ativado em
    // Authentication > Sign-in method no console do Firebase. Isso, combinado
    // com regras do Firestore que exigem "request.auth != null", impede que
    // qualquer visitante aleatório da internet leia ou apague os dados —
    // mesmo com o firebaseConfig público no GitHub (veja o README.md).
    await firebase.auth().signInAnonymously();
    const firestore = firebase.firestore();
    window.storage = makeStorageShim(firestore);
    root.render(<App />);
  } catch (e) {
    console.error(e);
    root.render(<ErroConexao mensagem={e && e.message} />);
  }
})();
</script>
</body>
</html>
