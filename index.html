<!--
  CSP (item 1 do pedido de segurança):
  - script-src: só permite scripts locais e o CDN oficial (cdnjs) de onde vêm
    React/ReactDOM/Babel. 'unsafe-inline' é necessário aqui porque o Babel
    Standalone compila o JSX no navegador e injeta o resultado como um
    <script> gerado dinamicamente — sem isso, o app não roda. Isso é uma
    concessão conhecida da arquitetura "JSX compilado no navegador"; o jeito
    de eliminar de vez essa permissão seria pré-compilar o JSX (build step)
    antes de publicar, deixando só JS puro no arquivo final.
  - connect-src 'self': não fazemos nenhuma chamada fetch/XHR para API
    externa — os dados vêm do armazenamento compartilhado da própria
    plataforma (via Firebase Firestore, com login anônimo obrigatório).
    Por isso não há placeholder de URL de API para você substituir aqui.
  - object-src/base-uri/frame-ancestors bloqueados: reduz superfície para
    plugins, sequestro de <base> e clickjacking.
  Observação: como este arquivo roda como página publicada da Claude, a
  plataforma já impõe a própria política de segurança por cima desta (só
  libera scripts de um conjunto fixo de CDNs). Esta tag é uma camada extra,
  documentada e explícita, não a única linha de defesa.
-->

function keyToDocPath(key) {
  if (key.startsWith("cfg:")) return "config/" + key.slice(4);
  if (key.startsWith("animais:chunk:")) return "animais/chunk_" + key.slice("animais:chunk:".length);
  if (key.startsWith("lanc:")) return "lancamentos/" + key.slice(5);
  return "misc/" + key.replace(/[^a-zA-Z0-9_-]/g, "_");
}
function makeStorageShim(firestore) {
  return {
    async get(key) {
      const snap = await firestore.doc(keyToDocPath(key)).get();
      if (!snap.exists) return null;
      const data = snap.data();
      return { key, value: data && data.value, shared: true };
    },
    async set(key, value) {
      await firestore.doc(keyToDocPath(key)).set({ value });
      return { key, value, shared: true };
    },
    async delete(key) {
      await firestore.doc(keyToDocPath(key)).delete();
      return { key, deleted: true, shared: true };
    },
    async list(prefix) {
      if (prefix === "lanc:") {
        const snap = await firestore.collection("lancamentos").get();
        return { keys: snap.docs.map((d) => "lanc:" + d.id), prefix, shared: true };
      }
      return { keys: [], prefix, shared: true };
    },
  };
}

// Item 3 (tratamento robusto de respostas inesperadas): faz o parse de um
// registro isoladamente. Se um único campo vier corrompido/adulterado no
// armazenamento compartilhado, ele cai no valor padrão em vez de travar o
// carregamento dos outros campos ou quebrar a tela.
function safeJsonParse(str, fallback) {
  if (typeof str !== "string") return fallback;
  try {
    return JSON.parse(str);
  } catch {
    return fallback;
  }
}

// Item 4 (armazenamento seguro): nunca guardamos a senha em texto puro —
// nem no localStorage (que não usamos em nenhum lugar do app) nem no banco
// compartilhado. Só o hash SHA-256 é persistido; a senha digitada só existe
// em memória, no escopo da função, pelo tempo do cálculo do hash.
async function hashPin(pin) {
  const enc = new TextEncoder().encode(pin);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
}

// ---------- Histórico de sanidade (importado do sistema da fazenda) ----------
// Alimenta só os relatórios (pesquisa por animal e por medicamento). Não vira
// lançamento editável. Fica guardado em blocos compactos, como o banco de SISBOV.
function stripAccents(s) {
  return String(s == null ? "" : s).normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}
function normKey(s) {
  return stripAccents(s).toUpperCase().replace(/\s+/g, " ").trim();
}
const DAY0 = Date.UTC(2025, 0, 1);
function isoToDay(iso) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || ""));
  if (!m) return null;
  return Math.round((Date.UTC(+m[1], +m[2] - 1, +m[3]) - DAY0) / 86400000);
}
function dayToIso(day) {
  return new Date(DAY0 + day * 86400000).toISOString().slice(0, 10);
}
function parseDataAplicacao(s) {
  s = String(s || "").trim();
  let m = /^(\d{2})\/(\d{2})\/(\d{4})/.exec(s);
  if (m) return isoToDay(m[3] + "-" + m[2] + "-" + m[1]);
  m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s);
  return m ? isoToDay(s) : null;
}
// Arquivos exportados pelo Excel/sistemas antigos costumam vir em Windows-1252
// (acentos quebram se lidos como UTF-8). Tenta UTF-8 estrito e cai para 1252.
function decodeCsvBuffer(buf) {
  try {
    return new TextDecoder("utf-8", { fatal: true }).decode(buf);
  } catch (e) {
    return new TextDecoder("windows-1252").decode(buf);
  }
}
const PROTO_PREFIX = "PROTOCOLO: ";

// Busca pelo final do SISBOV. Primeiro tenta COM o dígito verificador (o número
// digitado são os últimos dígitos do SISBOV inteiro). Se nenhum animal terminar
// assim, tenta pelo manejo SEM o dígito verificador: esses resultados vêm
// marcados (semDv) e nunca são escolhidos sozinhos — o usuário confirma qual.
function buscarAnimais(animaisMap, query) {
  if (!query) return [];
  if (query.length >= 15) {
    const curral = animaisMap[query];
    return curral !== undefined ? [{ sisbov: query, curral }] : [];
  }
  const entries = Object.entries(animaisMap);
  const comDv = entries.filter(([sisbov]) => sisbov.endsWith(query)).map(([sisbov, curral]) => ({ sisbov, curral }));
  if (comDv.length > 0) return comDv;
  return entries
    .filter(([sisbov]) => sisbov.slice(0, -1).endsWith(query))
    .map(([sisbov, curral]) => ({ sisbov, curral, semDv: true }));
}

// Histórico de um animal (aba Lançar): todas as aplicações já registradas,
// lançamentos do app + histórico de sanidade importado, mais recentes primeiro.
// Aplicação do histórico que já existe como lançamento (mesmo animal, data e
// motivo) não aparece duas vezes.
function computeAnimalHistory(sisbov, lancamentos, sanidade) {
  const itens = [];
  const liveKeys = new Set();
  (lancamentos || []).forEach((l) => {
    if (l.sisbov !== sisbov) return;
    const motivo = normKey(l.motivo) || "SEM MOTIVO";
    const d = isoToDay(l.data);
    if (d !== null) liveKeys.add(d + "|" + motivo);
    itens.push({
      iso: String(l.data || "").slice(0, 10),
      motivo,
      protocolo: false,
      origem: "app",
      ts: l.dataRegistro || 0,
      meds: (l.medicamentos || []).map((m) => ({ nome: m.medicamento, ml: m.ml })),
    });
  });
  const evs = (sanidade && sanidade.byAnimal[sisbov]) || [];
  evs.forEach((ev) => {
    const label = sanidade.meta.labels[ev[1]] || "SEM MOTIVO";
    if (liveKeys.has(ev[0] + "|" + label)) return;
    const meds = [];
    for (let j = 2; j < ev.length; j++) meds.push({ nome: sanidade.meta.farmacos[ev[j]] });
    itens.push({ iso: dayToIso(ev[0]), motivo: label, protocolo: label.indexOf(PROTO_PREFIX) === 0, origem: "historico", ts: 0, meds });
  });
  itens.sort((a, b) => (a.iso < b.iso ? 1 : a.iso > b.iso ? -1 : (b.ts || 0) - (a.ts || 0)));
  return itens;
}
const SANIDADE_CHUNK_CHARS = 150000;

function buildSanidade(text, opts) {
  const lines = text.split(/\r\n|\n|\r/);
  let hi = 0;
  while (hi < lines.length && !lines[hi].trim()) hi++;
  if (hi >= lines.length) return { error: "Arquivo vazio." };
  const delim = detectDelimiter(lines[hi]);
  const header = splitCsvLine(lines[hi], delim).map(normalizeHeader);
  const iS = header.indexOf("sisbov");
  const iF = header.indexOf("farmaco");
  const iD = header.indexOf("data_aplicacao");
  const iM = header.indexOf("motivo");
  const iP = header.indexOf("protocolo_sanitario");
  if (iS < 0 || iF < 0 || iD < 0 || iM < 0) {
    return { error: "Não encontrei as colunas sisbov, farmaco, data_aplicacao e motivo. Confira se é o arquivo de sanidade." };
  }

  const labels = [], labelIdx = new Map();
  const farmacos = [], farmIdx = new Map();
  const byAnimal = new Map();
  let rows = 0, events = 0, skipped = 0, dayMin = Infinity, dayMax = -Infinity;

  for (let i = hi + 1; i < lines.length; i++) {
    const line = lines[i];
    if (!line || !line.trim()) continue;
    const c = line.indexOf('"') === -1 ? line.split(delim) : splitCsvLine(line, delim);
    const sisbov = (c[iS] || "").replace(/\D/g, "");
    const day = parseDataAplicacao(c[iD]);
    const farm = normKey(c[iF]);
    if (!sisbov || day === null || !farm) {
      skipped++;
      continue;
    }
    const mot = normKey(c[iM]);
    const prot = iP >= 0 ? normKey(c[iP]) : "";
    const label = mot || (prot ? PROTO_PREFIX + prot : "SEM MOTIVO");

    let li = labelIdx.get(label);
    if (li === undefined) {
      li = labels.length;
      labels.push(label);
      labelIdx.set(label, li);
    }
    let fi = farmIdx.get(farm);
    if (fi === undefined) {
      fi = farmacos.length;
      farmacos.push(farm);
      farmIdx.set(farm, fi);
    }
    let evs = byAnimal.get(sisbov);
    if (!evs) {
      evs = new Map();
      byAnimal.set(sisbov, evs);
    }
    // Um "evento" = mesmo animal, mesma data e mesmo motivo/protocolo
    // (várias linhas de fármacos do mesmo atendimento viram um evento só).
    const ek = day + "|" + li;
    let ev = evs.get(ek);
    if (!ev) {
      ev = [day, li];
      evs.set(ek, ev);
      events++;
    }
    if (ev.indexOf(fi, 2) === -1) ev.push(fi);
    rows++;
    if (day < dayMin) dayMin = day;
    if (day > dayMax) dayMax = day;
  }

  if (rows === 0) return { error: "Não encontrei nenhuma linha válida no arquivo." };

  if (opts && opts.noChunks) {
    const obj = {};
    byAnimal.forEach((evMap, s) => {
      obj[s] = Array.from(evMap.values());
    });
    return { byAnimal: obj, meta: { labels, farmacos, rows, events, animals: byAnimal.size, dayMin, dayMax, skipped } };
  }

  const chunks = [];
  let cur = {}, curLen = 2, curCount = 0;
  byAnimal.forEach((evMap, s) => {
    const arr = Array.from(evMap.values());
    const len = s.length + 5 + JSON.stringify(arr).length;
    if (curCount > 0 && curLen + len > SANIDADE_CHUNK_CHARS) {
      chunks.push(cur);
      cur = {};
      curLen = 2;
      curCount = 0;
    }
    cur[s] = arr;
    curLen += len;
    curCount++;
  });
  if (curCount > 0) chunks.push(cur);

  return { chunks, meta: { labels, farmacos, rows, events, animals: byAnimal.size, dayMin, dayMax, skipped } };
}

// Relatório por animal: junta os lançamentos do app com o histórico importado.
// Evento do histórico que já existe como lançamento (mesmo animal, data e
// motivo) não é contado duas vezes — as linhas "WEB" do sistema da fazenda
// costumam ser justamente os lançamentos feitos no app.
function computeAnimalStats(sisbov, lancamentos, sanidade) {
  const porMotivo = {};
  const liveKeys = new Set();
  let ultTrat = null, ultProt = null, nLive = 0, nHist = 0;
  lancamentos.forEach((l) => {
    if (l.sisbov !== sisbov) return;
    nLive++;
    const m = normKey(l.motivo) || "SEM MOTIVO";
    porMotivo[m] = (porMotivo[m] || 0) + 1;
    const d = isoToDay(l.data);
    if (d !== null) liveKeys.add(d + "|" + m);
    const iso = String(l.data || "").slice(0, 10);
    if (iso && (!ultTrat || iso > ultTrat.iso)) ultTrat = { iso, motivo: m };
  });
  const evs = (sanidade && sanidade.byAnimal[sisbov]) || [];
  evs.forEach((ev) => {
    const label = sanidade.meta.labels[ev[1]] || "SEM MOTIVO";
    if (liveKeys.has(ev[0] + "|" + label)) return;
    nHist++;
    porMotivo[label] = (porMotivo[label] || 0) + 1;
    const iso = dayToIso(ev[0]);
    if (label.indexOf(PROTO_PREFIX) === 0) {
      if (!ultProt || iso > ultProt.iso) ultProt = { iso, motivo: label };
    } else if (!ultTrat || iso > ultTrat.iso) {
      ultTrat = { iso, motivo: label };
    }
  });
  const entries = Object.entries(porMotivo);
  const tratamentos = entries.filter(([k]) => k.indexOf(PROTO_PREFIX) !== 0).sort((a, b) => b[1] - a[1]);
  const protocolos = entries.filter(([k]) => k.indexOf(PROTO_PREFIX) === 0).sort((a, b) => b[1] - a[1]);
  const nTrat = tratamentos.reduce((s, e) => s + e[1], 0);
  const nProt = protocolos.reduce((s, e) => s + e[1], 0);
  return { total: nTrat + nProt, nLive, nHist, nTrat, nProt, tratamentos, protocolos, ultimo: ultTrat || ultProt };
}

// Relatório por medicamento (selKey = nome normalizado com normKey).
function computeMedStats(selKey, lancamentos, sanidade) {
  const porMotivo = {};
  const liveKeys = new Set();
  let nLive = 0, nHist = 0;
  lancamentos.forEach((l) => {
    const has = l.medicamentos && l.medicamentos.some((m) => normKey(m.medicamento) === selKey);
    if (!has) return;
    const m = normKey(l.motivo) || "SEM MOTIVO";
    nLive++;
    porMotivo[m] = (porMotivo[m] || 0) + 1;
    const d = isoToDay(l.data);
    if (d !== null) liveKeys.add(l.sisbov + "|" + d + "|" + m);
  });
  if (sanidade) {
    const fi = sanidade.meta.farmacos.findIndex((f) => normKey(f) === selKey);
    if (fi >= 0) {
      const labels = sanidade.meta.labels;
      const byA = sanidade.byAnimal;
      for (const s in byA) {
        const evs = byA[s];
        for (let k = 0; k < evs.length; k++) {
          const ev = evs[k];
          let has = false;
          for (let j = 2; j < ev.length; j++) {
            if (ev[j] === fi) {
              has = true;
              break;
            }
          }
          if (!has) continue;
          const label = labels[ev[1]] || "SEM MOTIVO";
          if (liveKeys.has(s + "|" + ev[0] + "|" + label)) continue;
          nHist++;
          porMotivo[label] = (porMotivo[label] || 0) + 1;
        }
      }
    }
  }
  const entries = Object.entries(porMotivo);
  const tratamentos = entries.filter(([k]) => k.indexOf(PROTO_PREFIX) !== 0).sort((a, b) => b[1] - a[1]);
  const protocolos = entries.filter(([k]) => k.indexOf(PROTO_PREFIX) === 0).sort((a, b) => b[1] - a[1]);
  return { total: nLive + nHist, nLive, nHist, tratamentos, protocolos };
}


// ---------- Banco de dados vindo de arquivos do próprio site (GitHub → Render) ----------
// ANIMAIS_APK e sanidade ficam na raiz do repositório (como .csv OU .zip) e são
// publicados pelo Render junto com o app. O resultado já processado fica guardado
// neste aparelho (IndexedDB) e só é refeito quando o arquivo muda. Nada vai para a nuvem.
const NOMES_PADRAO = {
  animais: ["ANIMAIS_APK.csv", "ANIMAIS_APK.zip", "animais_apk.csv", "animais_apk.zip", "animais.csv", "animais.zip"],
  sanidade: ["sanidade.csv", "sanidade.zip", "SANIDADE.csv", "SANIDADE.zip"],
};
const IDB_NAME = "controle-medicamentos-dados";
const mb = (n) => (n / 1048576).toFixed(1).replace(".", ",");

let idbPromise = null;
function idbOpen() {
  // Uma única conexão reaproveitada (não abre uma nova a cada leitura).
  if (!idbPromise) {
    idbPromise = new Promise((resolve) => {
      try {
        const req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = () => req.result.createObjectStore("datasets");
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => resolve(null);
        req.onblocked = () => resolve(null);
      } catch (e) {
        resolve(null);
      }
    });
  }
  return idbPromise;
}
async function idbGet(key) {
  const db = await idbOpen();
  if (!db) return null;
  return new Promise((resolve) => {
    try {
      const r = db.transaction("datasets", "readonly").objectStore("datasets").get(key);
      r.onsuccess = () => resolve(r.result || null);
      r.onerror = () => resolve(null);
    } catch (e) {
      resolve(null);
    }
  });
}
async function idbSet(key, val) {
  const db = await idbOpen();
  if (!db) return false;
  return new Promise((resolve) => {
    try {
      const tx = db.transaction("datasets", "readwrite");
      tx.objectStore("datasets").put(val, key);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => resolve(false);
      tx.onabort = () => resolve(false);
    } catch (e) {
      resolve(false);
    }
  });
}

async function fetchManifest() {
  try {
    const r = await fetch("manifest.json", { cache: "no-cache" });
    if (r.status === 404) return { dados: {}, estado: "não existe (é opcional)" };
    if (!r.ok) return { dados: {}, estado: `erro ${r.status}` };
    const j = await r.json();
    return { dados: j && typeof j === "object" ? j : {}, estado: "ok" };
  } catch (e) {
    return { dados: {}, estado: "falhou: " + ((e && e.message) || e) };
  }
}

// O site está respondendo? (qualquer resposta HTTP serve, até 404.) Separa "sem internet"
// de "o navegador bloqueou/derrubou o download de um arquivo específico".
async function siteAlcancavel() {
  try {
    await fetch("manifest.json", { cache: "no-store" });
    return true;
  } catch (e) {
    return false;
  }
}
// Uma nova tentativa rápida: falhas de rede passageiras são comuns no celular.
async function fetchComRetry(url) {
  try {
    return await fetch(url, { cache: "no-cache" });
  } catch (e) {
    await new Promise((r) => setTimeout(r, 300));
    return await fetch(url, { cache: "no-cache" });
  }
}

// Nome de arquivo informado no manifest.json (só aceita .csv/.zip simples).
function nomeArquivoSeguro(entry) {
  const n = entry && typeof entry.arquivo === "string" ? entry.arquivo.trim() : "";
  return /^[A-Za-z0-9_][A-Za-z0-9_.\- ()]*\.(csv|zip)$/i.test(n) ? n : "";
}
// Nomes que o app procura no site (na raiz e na pasta "dados/"), na ordem.
function listaDeArquivos(kind, manifestEntry) {
  const extra = nomeArquivoSeguro(manifestEntry);
  const base = Array.from(new Set((extra ? [extra] : []).concat(NOMES_PADRAO[kind])));
  return base.concat(base.map((n) => "dados/" + n));
}

// ---- .zip (o do Windows: "Enviar para > Pasta compactada") lido no próprio navegador ----
function ehZip(buf) {
  const u = new Uint8Array(buf);
  return u.length > 4 && u[0] === 0x50 && u[1] === 0x4b && u[2] === 0x03 && u[3] === 0x04;
}
function pareceHtml(buf) {
  const head = new TextDecoder("utf-8").decode(new Uint8Array(buf, 0, Math.min(buf.byteLength, 300))).trimStart().toLowerCase();
  return head.indexOf("<!doctype html") === 0 || head.indexOf("<html") === 0;
}
async function inflarRaw(u8) {
  if (typeof DecompressionStream === "undefined") {
    throw new Error("este navegador não abre .zip — use o arquivo .csv");
  }
  const stream = new Response(u8).body.pipeThrough(new DecompressionStream("deflate-raw"));
  return await new Response(stream).arrayBuffer();
}
async function extrairCsvDoZip(buf) {
  const u = new Uint8Array(buf);
  const dv = new DataView(buf);
  let eocd = -1;
  for (let i = u.length - 22; i >= Math.max(0, u.length - 65557); i--) {
    if (dv.getUint32(i, true) === 0x06054b50) {
      eocd = i;
      break;
    }
  }
  if (eocd < 0) throw new Error("zip inválido");
  const total = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const entradas = [];
  for (let n = 0; n < total; n++) {
    if (dv.getUint32(p, true) !== 0x02014b50) throw new Error("zip inválido");
    const metodo = dv.getUint16(p + 10, true);
    const tamComp = dv.getUint32(p + 20, true);
    const nomeLen = dv.getUint16(p + 28, true);
    const extraLen = dv.getUint16(p + 30, true);
    const comLen = dv.getUint16(p + 32, true);
    const offLocal = dv.getUint32(p + 42, true);
    const nome = new TextDecoder("utf-8").decode(u.subarray(p + 46, p + 46 + nomeLen));
    entradas.push({ nome, metodo, tamComp, offLocal });
    p += 46 + nomeLen + extraLen + comLen;
  }
  const util = entradas.filter((e) => !/\/$/.test(e.nome) && e.nome.indexOf("__MACOSX/") !== 0 && !/(^|\/)\._/.test(e.nome));
  const alvo = util.find((e) => /\.csv$/i.test(e.nome)) || util[0];
  if (!alvo) throw new Error("o zip está vazio");
  if (alvo.tamComp === 0xffffffff) throw new Error("zip grande demais");
  if (dv.getUint32(alvo.offLocal, true) !== 0x04034b50) throw new Error("zip inválido");
  const ini = alvo.offLocal + 30 + dv.getUint16(alvo.offLocal + 26, true) + dv.getUint16(alvo.offLocal + 28, true);
  const dados = u.subarray(ini, ini + alvo.tamComp);
  if (alvo.metodo === 0) return dados.slice().buffer;
  if (alvo.metodo === 8) return await inflarRaw(dados);
  throw new Error("tipo de compressão não suportado");
}

// Baixa o corpo da resposta mostrando o andamento.
async function lerCorpo(resp, aoAndar) {
  if (!resp.body || !resp.body.getReader) return await resp.arrayBuffer();
  const reader = resp.body.getReader();
  const partes = [];
  let total = 0;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    partes.push(value);
    total += value.length;
    if (aoAndar) aoAndar(total);
  }
  const out = new Uint8Array(total);
  let o = 0;
  partes.forEach((pt) => {
    out.set(pt, o);
    o += pt.length;
  });
  return out.buffer;
}

function parseAnimaisFile(text) {
  const { rows, error } = parseAnimaisCsv(text);
  if (error) return { error };
  // SISBOV tem 15 dígitos: linhas com números curtos não são animais (evita aceitar planilha errada).
  const validos = rows.filter((r) => r.sisbov.length >= 12);
  if (validos.length === 0) {
    return { error: "não achei nenhum SISBOV (número de 15 dígitos) — confira se é a planilha de animais." };
  }
  const map = {};
  validos.forEach((r) => {
    map[r.sisbov] = r.curral || null;
  });
  return { data: { map, count: validos.length } };
}
function parseSanidadeFile(text) {
  const b = buildSanidade(text, { noChunks: true });
  if (b.error) return { error: b.error };
  return { data: { meta: b.meta, byAnimal: b.byAnimal } };
}

// Data exibida como "atualizado em": a mais recente entre a data do manifest.json
// e a data do arquivo no servidor (Last-Modified). Sem nenhuma das duas, usa o
// momento em que esta versão do arquivo foi vista pela primeira vez neste aparelho.
function dataAtualizacao(rec, lastModMs, manifestMs) {
  const c = [manifestMs, lastModMs].filter((v) => Number.isFinite(v));
  return c.length ? Math.max(...c) : rec.firstSeen || Date.now();
}

function mensagemDeErro(nomes, tentativas) {
  const inval = tentativas.find((t) => t.resultado.indexOf("formato inválido") === 0 || t.resultado.indexOf("não consegui abrir") === 0);
  if (inval) return `${inval.arquivo}: ${inval.resultado}`;
  const html = tentativas.find((t) => t.resultado.indexOf("página HTML") >= 0);
  if (html) {
    return `O site devolveu a página do app no lugar de ${html.arquivo}. No Render, veja em Redirects/Rewrites se existe uma regra mandando tudo para /index.html e apague-a.`;
  }
  const falha = tentativas.find((t) => t.resultado.indexOf("falha ao baixar") === 0);
  if (falha) {
    return `Não consegui baixar ${falha.arquivo} (${falha.resultado.replace("falha ao baixar — ", "")}), embora o site esteja respondendo. Algo neste aparelho ou rede está bloqueando o arquivo: tente o .zip (bem menor) ou use o "Plano B" abaixo.`;
  }
  if (tentativas.some((t) => t.resultado.indexOf("sem conexão") === 0)) {
    return `Sem conexão com o site para baixar ${nomes[0]}. Confira a internet do aparelho (se já houver dados guardados nele, o app usa esses).`;
  }
  return `Não encontrei ${nomes[0]} (nem a versão .zip) no site. Suba o arquivo no GitHub, na mesma pasta do index.html.`;
}

// Procura e carrega o arquivo de um tipo ("animais" ou "sanidade") no site.
async function carregarDoSite(kind, parse, manifestEntry, force, onProgress) {
  const cached = await idbGet(kind);
  const nomes = listaDeArquivos(kind, manifestEntry);
  const ordem = cached && cached.file && nomes.indexOf(cached.file) >= 0 ? [cached.file].concat(nomes.filter((n) => n !== cached.file)) : nomes;
  const stamp = (manifestEntry && manifestEntry.atualizado_em) || "";
  const manifestMs = Date.parse(stamp);
  const tentativas = [];
  let semRede = false;
  for (const file of ordem) {
    let resp;
    try {
      resp = await fetchComRetry(file);
    } catch (e) {
      const motivo = `${(e && e.name) || "Erro"}: ${(e && e.message) || e}`;
      if (!(await siteAlcancavel())) {
        tentativas.push({ arquivo: file, resultado: `sem conexão (${motivo})` });
        semRede = true;
        break;
      }
      tentativas.push({ arquivo: file, resultado: `falha ao baixar — ${motivo}` });
      continue;
    }
    if (resp.status === 404) {
      tentativas.push({ arquivo: file, resultado: "não existe (404)" });
      continue;
    }
    if (!resp.ok) {
      tentativas.push({ arquivo: file, resultado: `erro ${resp.status} do servidor` });
      continue;
    }
    const etag = resp.headers.get("etag") || "";
    const lastModMs = Date.parse(resp.headers.get("last-modified") || "");
    const usable = cached && cached.file === file ? cached : null;
    const doCache = (rec, atualizar) => ({
      data: rec.data, updatedAt: atualizar, arquivo: file, bytes: rec.bytes, via: rec.via, tentativas,
    });

    // Mesmo arquivo de antes (mesmo ETag e mesma data no manifest): reaproveita o que já foi processado.
    if (usable && !force && etag && usable.etag === etag && usable.manifestStamp === stamp) {
      try {
        if (resp.body) resp.body.cancel();
      } catch (e) {}
      tentativas.push({ arquivo: file, resultado: "sem mudanças — usando o que já está guardado neste aparelho" });
      return doCache(usable, dataAtualizacao(usable, lastModMs, manifestMs));
    }

    if (onProgress) onProgress(`Baixando ${file}…`);
    let buf;
    try {
      buf = await lerCorpo(resp, (got) => onProgress && onProgress(`Baixando ${file}… ${mb(got)} MB`));
    } catch (e) {
      tentativas.push({ arquivo: file, resultado: `falha ao baixar — a conexão caiu no meio (${(e && e.message) || e})` });
      continue;
    }
    if (pareceHtml(buf)) {
      tentativas.push({ arquivo: file, resultado: "o site devolveu uma página HTML, não o arquivo" });
      continue;
    }
    // Servidor mandou outro ETag, mas o conteúdo tem o mesmo tamanho: não reprocessa.
    if (usable && !force && usable.byteLength === buf.byteLength && usable.manifestStamp === stamp) {
      const rec = { ...usable, etag, updatedAt: dataAtualizacao(usable, lastModMs, manifestMs) };
      idbSet(kind, rec);
      tentativas.push({ arquivo: file, resultado: "sem mudanças — usando o que já está guardado neste aparelho" });
      return doCache(rec, rec.updatedAt);
    }

    let csvBuf = buf;
    let via = "csv";
    if (ehZip(buf)) {
      if (onProgress) onProgress(`Abrindo ${file}…`);
      try {
        csvBuf = await extrairCsvDoZip(buf);
        via = "zip";
      } catch (e) {
        tentativas.push({ arquivo: file, resultado: "não consegui abrir o zip: " + e.message });
        continue;
      }
    }
    if (onProgress) onProgress(`Processando ${file}…`);
    await new Promise((r) => setTimeout(r, 0)); // deixa a tela atualizar antes do trabalho pesado
    const parsed = parse(decodeCsvBuffer(csvBuf));
    if (parsed.error) {
      tentativas.push({ arquivo: file, resultado: "formato inválido — " + parsed.error });
      continue;
    }
    const rec = { file, etag, byteLength: buf.byteLength, bytes: buf.byteLength, via, manifestStamp: stamp, firstSeen: Date.now(), data: parsed.data };
    rec.updatedAt = dataAtualizacao(rec, lastModMs, manifestMs);
    await idbSet(kind, rec);
    tentativas.push({ arquivo: file, resultado: `ok · ${mb(buf.byteLength)} MB${via === "zip" ? " (zip)" : ""}` });
    return doCache(rec, rec.updatedAt);
  }
  // Sem rede / servidor com problema, mas já há dados guardados neste aparelho: usa-os.
  if (cached && cached.data && (semRede || tentativas.some((t) => /^erro \d+/.test(t.resultado)))) {
    return { data: cached.data, updatedAt: cached.updatedAt, arquivo: cached.file, bytes: cached.bytes, via: cached.via, offline: true, tentativas };
  }
  const err = new Error(mensagemDeErro(nomes, tentativas));
  err.tentativas = tentativas;
  throw err;
}

// ---- Plano B: arquivo escolhido direto neste aparelho (não passa por GitHub nem nuvem) ----
function detectarTipo(text) {
  const primeira = text.split(/\r\n|\n|\r/).find((l) => l.trim()) || "";
  const h = splitCsvLine(primeira, detectDelimiter(primeira)).map(normalizeHeader);
  if (h.indexOf("farmaco") >= 0 && h.indexOf("data_aplicacao") >= 0) return "sanidade";
  if (h.indexOf("sisbov") >= 0 || h.length > 44) return "animais";
  return null;
}
async function carregarArquivosLocais(files, onProgress) {
  const res = [];
  for (const f of files) {
    try {
      if (onProgress) onProgress(`Lendo ${f.name}…`);
      const buf = await f.arrayBuffer();
      const zip = ehZip(buf);
      const text = decodeCsvBuffer(zip ? await extrairCsvDoZip(buf) : buf);
      const tipo = detectarTipo(text);
      if (!tipo) {
        res.push({ ok: false, nome: f.name, msg: `${f.name}: não reconheci o arquivo (esperava a planilha de animais ou a de sanidade).` });
        continue;
      }
      if (onProgress) onProgress(`Processando ${f.name}…`);
      await new Promise((r) => setTimeout(r, 0));
      const parsed = (tipo === "animais" ? parseAnimaisFile : parseSanidadeFile)(text);
      if (parsed.error) {
        res.push({ ok: false, nome: f.name, msg: `${f.name}: ${parsed.error}` });
        continue;
      }
      const rec = { file: f.name, byteLength: buf.byteLength, bytes: buf.byteLength, via: zip ? "zip" : "csv", firstSeen: Date.now(), updatedAt: f.lastModified || Date.now(), data: parsed.data, manual: true };
      await idbSet(tipo + "_manual", rec);
      res.push({ ok: true, nome: f.name, tipo, msg: `${tipo === "animais" ? "Animais" : "Sanidade"} carregado neste aparelho (${f.name}).` });
    } catch (e) {
      console.error("Erro ao ler arquivo do aparelho:", e);
      res.push({ ok: false, nome: f.name, msg: `${f.name}: não consegui ler o arquivo (${e.message}).` });
    }
  }
  return res;
}
async function limparArquivosLocais() {
  await idbSet("animais_manual", null);
  await idbSet("sanidade_manual", null);
}

async function loadStaticDatasets(force, onProgress) {
  const mf = await fetchManifest();
  const manifest = mf.dados;
  const wrap = (p) => p.then((r) => ({ r }), (e) => ({ e }));
  const [sa, ss] = await Promise.all([
    wrap(carregarDoSite("animais", parseAnimaisFile, manifest.animais, force, onProgress)),
    wrap(carregarDoSite("sanidade", parseSanidadeFile, manifest.sanidade, force, onProgress)),
  ]);
  const [ma, ms] = await Promise.all([idbGet("animais_manual"), idbGet("sanidade_manual")]);
  const out = {
    animaisMap: {}, animaisUpdatedAt: null, sanidade: null, errors: {}, offline: false, diag: {}, fontes: {},
    contexto: {
      origem: typeof location !== "undefined" ? location.origin : "",
      protocolo: typeof location !== "undefined" ? location.protocol : "",
      online: typeof navigator !== "undefined" ? navigator.onLine : true,
      manifest: mf.estado,
    },
  };
  // Fonte escolhida: o arquivo do aparelho só vale se for mais novo que o do site (ou se o site não tiver).
  const escolher = (kind, site, manual) => {
    out.diag[kind] = site.r ? site.r.tentativas : (site.e && site.e.tentativas) || [];
    if (manual && manual.data && (!site.r || manual.updatedAt >= site.r.updatedAt)) {
      out.fontes[kind] = { origem: "aparelho", arquivo: manual.file, bytes: manual.bytes, via: manual.via };
      return { data: manual.data, updatedAt: manual.updatedAt };
    }
    if (site.r) {
      if (site.r.offline) out.offline = true;
      out.fontes[kind] = { origem: "site", arquivo: site.r.arquivo, bytes: site.r.bytes, via: site.r.via };
      return { data: site.r.data, updatedAt: site.r.updatedAt };
    }
    out.errors[kind] = (site.e && site.e.message) || "Não consegui carregar o arquivo.";
    return null;
  };
  const A = escolher("animais", sa, ma);
  if (A) {
    out.animaisMap = A.data.map;
    out.animaisUpdatedAt = A.updatedAt;
  }
  const S = escolher("sanidade", ss, ms);
  if (S) out.sanidade = { meta: { ...S.data.meta, updatedAt: S.updatedAt }, byAnimal: S.data.byAnimal };
  return out;
}

const uid = () => `${Date.now()}_${Math.random().toString(36).slice(2, 9)}`;
const todayStr = () => new Date().toISOString().slice(0, 10);
const fmtDate = (iso) => {
  if (!iso) return "";
  const [y, m, d] = iso.split("-");
  return `${d}/${m}/${y}`;
};
const fmtDateTime = (ts) => {
  const d = new Date(ts);
  return d.toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", year: "2-digit", hour: "2-digit", minute: "2-digit" });
};

function detectDelimiter(line) {
  const candidates = [";", ",", "\t"];
  let best = ",";
  let bestCount = -1;
  candidates.forEach((d) => {
    const count = line.split(d).length - 1;
    if (count > bestCount) {
      bestCount = count;
      best = d;
    }
  });
  return best;
}

function splitCsvLine(line, delim) {
  const result = [];
  let cur = "";
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') {
      if (inQuotes && line[i + 1] === '"') {
        cur += '"';
        i++;
      } else {
        inQuotes = !inQuotes;
      }
    } else if (ch === delim && !inQuotes) {
      result.push(cur);
      cur = "";
    } else {
      cur += ch;
    }
  }
  result.push(cur);
  return result.map((s) => s.trim());
}

function normalizeHeader(h) {
  return h
    .trim()
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9_]/g, "");
}

function parseAnimaisCsv(text) {
  const lines = text.split(/\r\n|\n|\r/).filter((l) => l.trim().length > 0);
  if (lines.length === 0) return { rows: [], error: "Arquivo vazio." };

  const delim = detectDelimiter(lines[0]);
  const headerCells = splitCsvLine(lines[0], delim).map(normalizeHeader);
  const looksLikeBigExport = headerCells.length > 44;
  const sisbovIdx = headerCells.findIndex((h) => h === "sisbov");

  let dataLines = lines;
  let sIdx = 0;
  let cIdx = 1;

  if (sisbovIdx !== -1) {
    sIdx = sisbovIdx;
    if (looksLikeBigExport) {
      cIdx = 44;
    } else {
      cIdx = headerCells.findIndex((h) => h === "local_atual" || h === "curral" || h === "curral_atual");
    }
    dataLines = lines.slice(1);
  } else if (looksLikeBigExport) {
    sIdx = 3;
    cIdx = 44;
    dataLines = lines.slice(1);
  }

  const rows = [];
  dataLines.forEach((line) => {
    const cells = splitCsvLine(line, delim);
    const sisbov = (cells[sIdx] || "").replace(/\D/g, "");
    if (!sisbov) return;
    const curral = cIdx !== -1 && cells[cIdx] ? cells[cIdx].trim().toUpperCase() : null;
    rows.push({ sisbov, curral: curral || null });
  });

  return { rows, error: rows.length === 0 ? "Não encontrei nenhum SISBOV válido no conteúdo." : null };
}

const EAR_TAG_CLIP = "polygon(0% 0%, 88% 0%, 100% 50%, 88% 100%, 0% 100%)";

function EarTag({ children, tone = "amber" }) {

  return (
    <span
      style={{

        fontSize: 12,
        letterSpacing: "0.02em",
        padding: "4px 14px 4px 8px",
        clipPath: EAR_TAG_CLIP,
        fontVariantNumeric: "tabular-nums",
        whiteSpace: "nowrap",
      }}
    >
      {children}
    </span>
  );
}

function Field({ label, required, children, hint }) {
  return (
    <label style={{ display: "block", marginBottom: 14 }}>
      <div style={{ fontSize: 12, fontWeight: 700, color: "#4A4E3F", textTransform: "uppercase", letterSpacing: "0.04em", marginBottom: 5 }}>
        {label} {required && <span style={{ color: "#B5442E" }}>*</span>}
      </div>
      {children}
      {hint && <div style={{ fontSize: 11.5, color: "#8B8A78", marginTop: 3 }}>{hint}</div>}
    </label>
  );
}

const inputBase = {
  width: "100%",
  boxSizing: "border-box",
  border: "1.5px solid #D7D5C4",
  borderRadius: 10,
  padding: "11px 12px",
  fontSize: 15,
  background: "#FFFFFF",
  color: "#20241A",
  outline: "none",
  fontFamily: "inherit",
};

function TextInput(props) {
  return <input {...props} style={{ ...inputBase, ...(props.style || {}) }} />;
}
function Select(props) {
  return (
    <select {...props} style={{ ...inputBase, ...(props.style || {}), appearance: "none", backgroundImage: "none" }}>
      {props.children}
    </select>
  );
}
function TextArea(props) {
  return <textarea {...props} style={{ ...inputBase, resize: "vertical", minHeight: 70, ...(props.style || {}) }} />;
}

function Btn({ children, onClick, variant = "primary", style, disabled, type = "button" }) {
  const variants = {
    primary: { background: "#2E4A2B", color: "#F3F4EC", border: "1.5px solid #2E4A2B" },
    accent: { background: "#D98F1F", color: "#3A2500", border: "1.5px solid #D98F1F" },
    ghost: { background: "transparent", color: "#2E4A2B", border: "1.5px solid #C8C6B4" },
    danger: { background: "transparent", color: "#B5442E", border: "1.5px solid #E4C4BC" },
  };
  return (
    <button
      type={type}
      onClick={onClick}
      disabled={disabled}
      style={{
        ...variants[variant],
        borderRadius: 10,
        padding: "11px 16px",
        fontSize: 14.5,
        fontWeight: 700,
        cursor: disabled ? "default" : "pointer",
        opacity: disabled ? 0.55 : 1,
        display: "inline-flex",
        alignItems: "center",
        justifyContent: "center",
        gap: 6,
        fontFamily: "inherit",
        ...style,
      }}
    >
      {children}
    </button>
  );
}

function Card({ children, style }) {
  return (
    <div
      style={{
        background: "#FFFFFF",
        border: "1px solid #E3E1D3",
        borderRadius: 14,
        padding: "16px 16px",
        ...style,
      }}
    >
      {children}
    </div>
  );
}

function SectionTitle({ children }) {
  return (
    <div
      style={{
        fontSize: 11.5,
        fontWeight: 800,
        color: "#6B6A57",
        textTransform: "uppercase",
        letterSpacing: "0.08em",
        margin: "22px 0 10px",
      }}
    >
      {children}
    </div>
  );
}

const errStyle = { borderColor: "#D98C77", background: "#FBF0EC" };

function LoginScreen({ usuarios, onLogin }) {
  const [selected, setSelected] = useState(null);
  const [senha, setSenha] = useState("");
  const [error, setError] = useState("");

  const tryLogin = async () => {
    if (!selected) return;
    const digitedHash = await hashPin(senha);
    if (digitedHash === selected.senhaHash) {
      onLogin(selected.nome);
    } else {
      setError("Senha incorreta.");
      setSenha("");
    }
  };

  return (
    <div
      style={{
        fontFamily: "system-ui, -apple-system, 'Segoe UI', sans-serif",
        background: "#F3F4EC",
        minHeight: 640,
        maxWidth: 460,
        margin: "0 auto",
        borderRadius: 18,
        overflow: "hidden",
        border: "1px solid #E3E1D3",
        display: "flex",
        flexDirection: "column",
      }}
    >
      <div style={{ background: "#2E4A2B", padding: "20px 18px", color: "#F3F4EC" }}>
        <div style={{ fontSize: 18, fontWeight: 800 }}>Controle de Medicamentos</div>
        <div style={{ fontSize: 12, color: "#B9C8AE", marginTop: 2 }}>Identifique-se para começar</div>
      </div>

      <div style={{ flex: 1, padding: 20 }}>
        {!selected ? (
          <>
            <div style={{ fontSize: 12, fontWeight: 800, color: "#6B6A57", textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 12 }}>
              Quem está aplicando?
            </div>
            {usuarios.map((u) => (
              <button
                key={u.nome}
                onClick={() => {
                  setSelected(u);
                  setError("");
                  setSenha("");
                }}
                style={{
                  display: "flex",
                  alignItems: "center",
                  gap: 10,
                  width: "100%",
                  boxSizing: "border-box",
                  background: "#FFFFFF",
                  border: "1px solid #E3E1D3",
                  borderRadius: 12,
                  padding: "14px 14px",
                  marginBottom: 8,
                  cursor: "pointer",
                  fontFamily: "inherit",
                  textAlign: "left",
                }}
              >
                <UserCircle2 size={22} color="#2E4A2B" />
                <span style={{ fontSize: 15, fontWeight: 700, color: "#20241A" }}>{u.nome}</span>
              </button>
            ))}
          </>
        ) : (
          <>
            <button
              onClick={() => {
                setSelected(null);
                setError("");
                setSenha("");
              }}
              style={{ background: "transparent", border: "none", color: "#6B6A57", fontSize: 13, fontWeight: 700, cursor: "pointer", padding: 0, marginBottom: 18, fontFamily: "inherit" }}
            >
              ‹ voltar
            </button>
            <div style={{ display: "flex", flexDirection: "column", alignItems: "center", marginBottom: 20 }}>
              <UserCircle2 size={40} color="#2E4A2B" style={{ marginBottom: 8 }} />
              <div style={{ fontSize: 17, fontWeight: 800, color: "#20241A" }}>{selected.nome}</div>
            </div>
            <Field label="Senha numérica">
              <TextInput
                autoFocus
                type="password"
                inputMode="numeric"
                placeholder="••••"
                value={senha}
                onChange={(e) => {
                  setSenha(e.target.value.replace(/\D/g, ""));
                  setError("");
                }}
                onKeyDown={(e) => e.key === "Enter" && tryLogin()}
                style={{ textAlign: "center", fontSize: 22, letterSpacing: "0.3em", ...(error ? errStyle : {}) }}
              />
            </Field>
            {error && (
              <div style={{ display: "flex", alignItems: "center", gap: 6, color: "#B5442E", fontSize: 13, marginBottom: 10 }}>
                <AlertCircle size={14} /> {error}
              </div>
            )}
            <Btn onClick={tryLogin} style={{ width: "100%", padding: "13px 0", fontSize: 15.5 }}>
              <KeyRound size={16} /> Entrar
            </Btn>
          </>
        )}
      </div>
    </div>
  );
}

function App() {
  const [ready, setReady] = useState(false);
  const [tab, setTab] = useState("lancar");
  const [saving, setSaving] = useState(false);
  const [toast, setToast] = useState(null);

  const [medicamentos, setMedicamentos] = useState([]);
  const [motivos, setMotivos] = useState([]);
  const [currais, setCurrais] = useState([]);
  const [lancamentos, setLancamentos] = useState([]);
  const [animaisMap, setAnimaisMap] = useState({});
  const [datasetsLoading, setDatasetsLoading] = useState(false);
  const [datasetErrors, setDatasetErrors] = useState({});
  const [datasetsStatus, setDatasetsStatus] = useState("");
  const [datasetInfo, setDatasetInfo] = useState({ diag: {}, fontes: {}, offline: false });
  const [animaisUpdatedAt, setAnimaisUpdatedAt] = useState(null);
  const [sanidade, setSanidade] = useState(null);
  const [usuarios, setUsuarios] = useState([]);
  const [currentUser, setCurrentUser] = useState(null);

  const showToast = (msg, tone = "ok") => {
    setToast({ msg, tone });
    setTimeout(() => setToast(null), 2600);
  };

  const loadAll = useCallback(async (opts = {}) => {
    const silent = !!opts.silent;
    try {
      const [medR, motR, curR, usrR] = await Promise.all([
        window.storage.get("cfg:medicamentos", true).catch(() => null),
        window.storage.get("cfg:motivos", true).catch(() => null),
        window.storage.get("cfg:currais", true).catch(() => null),
        window.storage.get("cfg:usuarios", true).catch(() => null),
      ]);
      let medList = medR ? safeJsonParse(medR.value, []) : [];
      let motList = motR ? safeJsonParse(motR.value, []) : [];

      if (medList.length === 0) {
        medList = SEED_MEDICAMENTOS;
        window.storage.set("cfg:medicamentos", JSON.stringify(medList), true).catch(() => {});
      }
      if (motList.length === 0) {
        motList = SEED_MOTIVOS;
        window.storage.set("cfg:motivos", JSON.stringify(motList), true).catch(() => {});
      }

      setMedicamentos(medList);
      setMotivos(motList);
      setCurrais(curR ? safeJsonParse(curR.value, []) : []);
      setUsuarios(usrR ? safeJsonParse(usrR.value, []) : []);

      const idx = await window.storage.list("lanc:", true).catch(() => null);
      if (idx && idx.keys && idx.keys.length) {
        const recs = await Promise.all(
          idx.keys.map((k) => window.storage.get(k, true).catch(() => null))
        );
        const parsed = recs
          .filter(Boolean)
          .map((r) => {
            try {
              return JSON.parse(r.value);
            } catch {
              return null;
            }
          })
          .filter(Boolean)
          .sort((a, b) => (b.dataRegistro || 0) - (a.dataRegistro || 0));
        setLancamentos(parsed);
      } else {
        setLancamentos([]);
      }
    } catch (e) {
      if (!silent) showToast("Não consegui carregar os dados. Puxe para atualizar.", "err");
    } finally {
      setReady(true);
    }
  }, []);

  useEffect(() => {
    loadAll();
  }, [loadAll]);

  useEffect(() => {
    const t = setInterval(() => {
      loadAll({ silent: true });
    }, 45000);
    return () => clearInterval(t);
  }, [loadAll]);

  // Banco de dados (animais + sanidade) vem dos arquivos publicados junto com o app.
  const loadDatasets = useCallback(async (force) => {
    setDatasetsLoading(true);
    setDatasetsStatus("Carregando banco de animais e histórico…");
    let errs = {};
    try {
      const ds = await loadStaticDatasets(!!force, setDatasetsStatus);
      setAnimaisMap(ds.animaisMap);
      setAnimaisUpdatedAt(ds.animaisUpdatedAt);
      setSanidade(ds.sanidade);
      setDatasetInfo({ diag: ds.diag, fontes: ds.fontes, offline: ds.offline, contexto: ds.contexto });
      errs = ds.errors;
    } catch (e) {
      console.error("Falha ao carregar o banco de dados:", e);
      errs = { geral: "Não consegui carregar o banco de dados. Recarregue a página." };
    } finally {
      setDatasetErrors(errs);
      setDatasetsLoading(false);
      setDatasetsStatus("");
    }
    return errs;
  }, []);

  useEffect(() => {
    loadDatasets(false);
  }, [loadDatasets]);

  const saveConfig = async (key, value, setter) => {
    setter(value);
    try {
      await window.storage.set(`cfg:${key}`, JSON.stringify(value), true);
    } catch {
      showToast("Falha ao salvar cadastro.", "err");
    }
  };

  const addMedicamento = (nome) => {
    nome = nome.trim().toUpperCase();
    if (!nome || medicamentos.some((m) => m.nome === nome)) return;
    saveConfig("medicamentos", [...medicamentos, { nome, lotes: [] }], setMedicamentos);
  };
  const removeMedicamento = (nome) => {
    saveConfig("medicamentos", medicamentos.filter((m) => m.nome !== nome), setMedicamentos);
  };
  const addLote = (nome, lote) => {
    lote = lote.trim();
    if (!lote) return;
    const next = medicamentos.map((m) =>
      m.nome === nome && !m.lotes.includes(lote) ? { ...m, lotes: [...m.lotes, lote] } : m
    );
    saveConfig("medicamentos", next, setMedicamentos);
  };
  const removeLote = (nome, lote) => {
    const next = medicamentos.map((m) =>
      m.nome === nome ? { ...m, lotes: m.lotes.filter((l) => l !== lote) } : m
    );
    saveConfig("medicamentos", next, setMedicamentos);
  };

  const addMotivo = (v) => {
    v = v.trim().toUpperCase();
    if (!v || motivos.includes(v)) return;
    saveConfig("motivos", [...motivos, v], setMotivos);
  };
  const removeMotivo = (v) => saveConfig("motivos", motivos.filter((m) => m !== v), setMotivos);

  const addCurral = (v) => {
    v = v.trim().toUpperCase();
    if (!v || currais.includes(v)) return;
    saveConfig("currais", [...currais, v], setCurrais);
  };
  const removeCurral = (v) => saveConfig("currais", currais.filter((c) => c !== v), setCurrais);

  const addUsuario = async (nome, senha) => {
    nome = nome.trim();
    senha = senha.replace(/\D/g, "");
    if (!nome || !senha) return;
    const senhaHash = await hashPin(senha); // nunca guardamos o PIN em texto puro
    const next = [...usuarios.filter((u) => u.nome.toLowerCase() !== nome.toLowerCase()), { nome, senhaHash }];
    saveConfig("usuarios", next, setUsuarios);
  };
  const removeUsuario = (nome) => {
    saveConfig("usuarios", usuarios.filter((u) => u.nome !== nome), setUsuarios);
    if (currentUser?.nome === nome) setCurrentUser(null);
  };
  const logout = () => setCurrentUser(null);

  // Recarrega os arquivos do site, ignorando o que já está guardado neste aparelho.
  const reloadDatasets = async () => {
    const errs = await loadDatasets(true);
    const msgs = Object.values(errs || {});
    if (msgs.length) showToast(msgs[0], "err");
    else showToast("Banco de dados recarregado dos arquivos do site.");
  };

  // Plano B: usa arquivos escolhidos neste aparelho (não passa por GitHub nem nuvem).
  const loadLocalFiles = async (fileList) => {
    const files = Array.from(fileList || []);
    if (!files.length) return;
    setDatasetsLoading(true);
    setDatasetsStatus("Lendo arquivos do aparelho…");
    let res = [];
    try {
      res = await carregarArquivosLocais(files, setDatasetsStatus);
    } catch (e) {
      console.error(e);
      res = [{ ok: false, msg: "Não consegui ler os arquivos." }];
    }
    await loadDatasets(false);
    const ruim = res.find((r) => !r.ok);
    if (ruim) showToast(ruim.msg, "err");
    else showToast(res.map((r) => r.msg).join(" "));
  };
  const clearLocalFiles = async () => {
    await limparArquivosLocais();
    await loadDatasets(false);
    showToast("Voltei a usar só os arquivos do site.");
  };

  const lookupAnimais = useCallback((query) => buscarAnimais(animaisMap, query), [animaisMap]);

  const animaisCount = useMemo(() => Object.keys(animaisMap).length, [animaisMap]);

  const addLancamento = async (rec) => {
    setSaving(true);
    const id = `lanc:${uid()}`;
    const full = { ...rec, id, ordem: lancamentos.length + 1, dataRegistro: Date.now() };
    try {
      await window.storage.set(id, JSON.stringify(full), true);
      setLancamentos((prev) => [full, ...prev]);
      showToast("Lançamento salvo.");
    } catch {
      showToast("Falha ao salvar o lançamento. Tente de novo.", "err");
    } finally {
      setSaving(false);
    }
  };

  const deleteLancamento = async (id) => {
    try {
      await window.storage.delete(id, true);
      setLancamentos((prev) => prev.filter((l) => l.id !== id));
      showToast("Lançamento removido.");
    } catch {
      showToast("Falha ao remover.", "err");
    }
  };

  // Marca (ts) ou desmarca (null) lançamentos como "já exportados / lançados no sistema".
  // semLote=true: marcação avulsa de um lançamento (não entra no "desfazer última exportação").
  const marcarExportados = async (ids, ts, semLote) => {
    const alvo = lancamentos.filter((l) => ids.indexOf(l.id) >= 0);
    if (!alvo.length) return true;
    try {
      const novos = alvo.map((l) => ({ ...l, exportadoEm: ts, exportLote: semLote ? null : ts }));
      await Promise.all(novos.map((n) => window.storage.set(n.id, JSON.stringify(n), true)));
      const porId = new Map(novos.map((n) => [n.id, n]));
      setLancamentos((prev) => prev.map((l) => porId.get(l.id) || l));
      return true;
    } catch (e) {
      console.error("Falha ao atualizar a marcação de exportados:", e);
      showToast("Falha ao atualizar a marcação de exportados. Tente de novo.", "err");
      return false;
    }
  };

  const updateLancamento = async (id, patch) => {
    try {
      const existing = lancamentos.find((l) => l.id === id);
      if (!existing) return;
      const updated = { ...existing, ...patch };
      await window.storage.set(id, JSON.stringify(updated), true);
      setLancamentos((prev) => prev.map((l) => (l.id === id ? updated : l)));
      showToast("Lançamento atualizado.");
    } catch {
      showToast("Falha ao atualizar o lançamento.", "err");
    }
  };

  if (!ready) {
    return (
      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", height: 420, gap: 10, color: "#6B6A57", fontFamily: "system-ui, -apple-system, sans-serif" }}>
        <Loader2 size={26} style={{ animation: "spin 1s linear infinite" }} />
        <div style={{ fontSize: 14 }}>Carregando dados da nuvem…</div>
      </div>
    );
  }

  if (usuarios.length > 0 && !currentUser) {
    return <LoginScreen usuarios={usuarios} onLogin={(nome) => setCurrentUser({ nome })} />;
  }

  return (
    <div
      style={{
        fontFamily: "system-ui, -apple-system, 'Segoe UI', sans-serif",
        background: "#F3F4EC",
        minHeight: 640,
        maxWidth: 460,
        margin: "0 auto",
        borderRadius: 18,
        overflow: "hidden",
        border: "1px solid #E3E1D3",
        display: "flex",
        flexDirection: "column",
        position: "relative",
      }}
    >
      <div style={{ background: "#2E4A2B", padding: "16px 18px 14px", color: "#F3F4EC" }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
          <div>
            <div style={{ fontSize: 18, fontWeight: 800, letterSpacing: "0.01em" }}>Controle de Medicamentos</div>
            <div style={{ fontSize: 12, color: "#B9C8AE", marginTop: 2 }}>Lançamentos compartilhados na nuvem</div>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
            <button
              onClick={loadAll}
              aria-label="Atualizar"
              style={{ background: "transparent", border: "none", color: "#B9C8AE", cursor: "pointer", padding: 6 }}
            >
              <RefreshCw size={18} />
            </button>
          </div>
        </div>
        {currentUser && (
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginTop: 10, paddingTop: 10, borderTop: "1px solid rgba(255,255,255,0.15)" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12.5, color: "#DCE6D2", fontWeight: 700 }}>
              <UserCircle2 size={15} /> {currentUser.nome}
            </div>
            <button
              onClick={logout}
              style={{ display: "flex", alignItems: "center", gap: 5, background: "transparent", border: "none", color: "#DCE6D2", cursor: "pointer", fontSize: 12, fontWeight: 700, fontFamily: "inherit" }}
            >
              <LogOut size={13} /> trocar usuário
            </button>
          </div>
        )}
      </div>

      <div style={{ flex: 1, overflowY: "auto", padding: "16px 16px 90px" }}>
        {tab === "lancar" && (
          <LancarTab
            medicamentos={medicamentos}
            motivos={motivos}
            currais={currais}
            onSubmit={addLancamento}
            saving={saving}
            addMotivo={addMotivo}
            addCurral={addCurral}
            lookupAnimais={lookupAnimais}
            currentUser={currentUser}
            animaisUpdatedAt={animaisUpdatedAt}
            sanidadeUpdatedAt={sanidade && sanidade.meta ? sanidade.meta.updatedAt : null}
            lancamentos={lancamentos}
            sanidade={sanidade}
            bancoCarregando={datasetsLoading ? datasetsStatus || true : false}
            avisoBanco={[datasetErrors.animais, datasetErrors.sanidade, datasetErrors.geral].filter(Boolean).join(" ")}
          />
        )}
        {tab === "historico" && (
          <HistoricoTab
            lancamentos={lancamentos}
            onDelete={deleteLancamento}
            onUpdate={updateLancamento}
            onMarkExported={marcarExportados}
            sanidade={sanidade}
            medicamentos={medicamentos}
            motivos={motivos}
            currais={currais}
          />
        )}
        {tab === "cadastros" && (
          <CadastrosTab
            medicamentos={medicamentos}
            motivos={motivos}
            currais={currais}
            addMedicamento={addMedicamento}
            removeMedicamento={removeMedicamento}
            addLote={addLote}
            removeLote={removeLote}
            addMotivo={addMotivo}
            removeMotivo={removeMotivo}
            addCurral={addCurral}
            removeCurral={removeCurral}
            animaisCount={animaisCount}
            animaisUpdatedAt={animaisUpdatedAt}
            sanidade={sanidade}
            datasetsLoading={datasetsLoading}
            datasetsStatus={datasetsStatus}
            datasetErrors={datasetErrors}
            datasetInfo={datasetInfo}
            onReloadDatasets={reloadDatasets}
            onLoadLocalFiles={loadLocalFiles}
            onClearLocalFiles={clearLocalFiles}
            usuarios={usuarios}
            addUsuario={addUsuario}
            removeUsuario={removeUsuario}
          />
        )}
      </div>

      <div
        style={{
          position: "sticky",
          bottom: 0,
          display: "flex",
          borderTop: "1px solid #E3E1D3",
          background: "#FFFFFF",
        }}
      >
        <NavBtn active={tab === "lancar"} onClick={() => setTab("lancar")} icon={<Syringe size={20} />} label="Lançar" />
        <NavBtn active={tab === "historico"} onClick={() => setTab("historico")} icon={<ClipboardList size={20} />} label="Histórico" />
        <NavBtn active={tab === "cadastros"} onClick={() => setTab("cadastros")} icon={<Settings size={20} />} label="Cadastros" />
      </div>

      {toast && (
        <div
          style={{
            position: "absolute",
            left: 16,
            right: 16,
            bottom: 78,
            background: toast.tone === "err" ? "#B5442E" : "#2E4A2B",
            color: "#fff",
            padding: "10px 14px",
            borderRadius: 10,
            fontSize: 13.5,
            fontWeight: 600,
            display: "flex",
            alignItems: "center",
            gap: 8,
            boxSizing: "border-box",
          }}
        >
          {toast.tone === "err" ? <AlertCircle size={16} /> : <Check size={16} />}
          {toast.msg}
        </div>
      )}
    </div>
  );
}

function emptyMedSlot() {
  return { medicamento: "", lote: "", ml: "" };
}

// Painel "Histórico" da aba Lançar: mostra se o animal já foi medicado, quando
// e com qual medicamento (lançamentos do app + histórico de sanidade).
function HistoricoAnimal({ sisbov, lancamentos, sanidade }) {
  const [verTodos, setVerTodos] = useState(false);
  const itens = useMemo(() => computeAnimalHistory(sisbov, lancamentos, sanidade), [sisbov, lancamentos, sanidade]);
  const LIMITE = 6;
  const visiveis = verTodos ? itens : itens.slice(0, LIMITE);
  const nomeMeds = (it) => it.meds.map((m) => (m.ml ? `${m.nome} ${m.ml} ml` : m.nome)).join(", ") || "—";

  if (itens.length === 0) {
    return (
      <div style={{ background: "#EAF3DE", border: "1.5px solid #B7D79A", borderRadius: 12, padding: "10px 12px", marginBottom: 14 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, fontWeight: 800, color: "#2E4A2B", textTransform: "uppercase", letterSpacing: "0.05em" }}>
          <ClipboardList size={14} /> Histórico
        </div>
        <div style={{ fontSize: 13.5, color: "#2E4A2B", fontWeight: 700, marginTop: 4 }}>Nenhuma medicação registrada para este animal.</div>
        {!sanidade && <div style={{ fontSize: 11.5, color: "#6B6A57", marginTop: 2 }}>(o histórico de sanidade não está carregado)</div>}
      </div>
    );
  }

  const nTrat = itens.filter((i) => !i.protocolo).length;
  const nProt = itens.length - nTrat;
  const ultimo = itens[0];
  return (
    <div style={{ background: "#FBF3E0", border: "1.5px solid #E8C97A", borderRadius: 12, padding: "10px 12px 6px", marginBottom: 14 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, fontWeight: 800, color: "#7A5A12", textTransform: "uppercase", letterSpacing: "0.05em" }}>
        <ClipboardList size={14} /> Histórico
      </div>
      <div style={{ fontSize: 14, color: "#20241A", fontWeight: 800, marginTop: 4 }}>
        Já medicado: {itens.length} {itens.length === 1 ? "registro" : "registros"}
      </div>
      <div style={{ fontSize: 11.5, color: "#6B6A57", marginBottom: 6 }}>
        {nTrat} tratamento{nTrat === 1 ? "" : "s"} · {nProt} de protocolo sanitário · última em {fmtDate(ultimo.iso)}
      </div>
      {visiveis.map((it, i) => (
        <div key={i} style={{ padding: "7px 0", borderTop: "1px solid #F0E3BE" }}>
          <div style={{ display: "flex", justifyContent: "space-between", gap: 8, fontSize: 12.5 }}>
            <span style={{ fontWeight: 800, color: "#20241A" }}>{fmtDate(it.iso)}</span>
            <span style={{ color: "#6B6A57", fontWeight: 700, textAlign: "right" }}>
              {it.protocolo ? "Protocolo: " : ""}
              {motivoNome(it.motivo)}
            </span>
          </div>
          <div style={{ fontSize: 13, color: "#3A3D31" }}>{nomeMeds(it)}</div>
        </div>
      ))}
      {itens.length > LIMITE && (
        <button
          type="button"
          onClick={() => setVerTodos(!verTodos)}
          style={{ background: "transparent", border: "none", color: "#7A5A12", fontWeight: 800, fontSize: 12.5, cursor: "pointer", padding: "6px 0 8px", fontFamily: "inherit" }}
        >
          {verTodos ? "Mostrar menos" : `Ver todos (${itens.length})`}
        </button>
      )}
    </div>
  );
}

  const [errors, setErrors] = useState({});
  const [matches, setMatches] = useState([]);

  const [checkingAnimal, setCheckingAnimal] = useState(false);
  const [showMaisCampos, setShowMaisCampos] = useState(false);

  const updateSlot = (i, patch) => {
    setSlots((prev) => prev.map((s, idx) => (idx === i ? { ...s, ...patch } : s)));
  };
  const addSlot = () => slots.length < 3 && setSlots([...slots, emptyMedSlot()]);
  const removeSlot = (i) => setSlots(slots.filter((_, idx) => idx !== i));

  const reset = () => {
    setSisbov("");
    setMotivo("");
    setSlots([emptyMedSlot()]);
    setDestino("");
    setPeso("");
    setTemp("");
    setModalidade("");
    setProtocolo("");
    setObs("");
    setErrors({});
    setMatches([]);
    setSelectedAnimal(null);
  };

  useEffect(() => {
    const digits = sisbov.replace(/\D/g, "");
    setSelectedAnimal(null);
    if (!lookupAnimais || digits.length < 5) {
      setMatches([]);
      return;
    }
    let cancelled = false;
    setCheckingAnimal(true);
    const t = setTimeout(() => {
      const found = lookupAnimais(digits);
      if (!cancelled) {
        setMatches(found);
        if (found.length === 1 && !found[0].semDv) setSelectedAnimal(found[0]);

    }, 400);
    return () => {

  const finalSisbov = selectedAnimal ? selectedAnimal.sisbov : sisbov.replace(/\D/g, "");

function csvEscapeSemi(value) {
  const s = value === null || value === undefined ? "" : String(value);
  if (/[;"\n]/.test(s)) return `"${s.replace(/"/g, '""')}"`;
  return s;
}

// ---------- Relatório em Excel (.xlsx): SISBOV como NÚMERO inteiro ----------
// Um CSV não guarda o tipo da célula (o Excel mostra o SISBOV como 1,05E+14). No .xlsx
// o SISBOV é uma célula numérica com formato "0" (aparece inteiro, sem notação científica).
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(u8) {
  let c = 0xffffffff;
  for (let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 0xff] ^ (c >>> 8);
  return (c ^ 0xffffffff) >>> 0;
}
function zipSemCompressao(arquivos) {
  const enc = new TextEncoder();
  const partes = [];
  const central = [];
  let offset = 0;
  arquivos.forEach((a) => {
    const nome = enc.encode(a.nome);
    const crc = crc32(a.dados);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true);
    lh.setUint16(4, 20, true);
    lh.setUint16(6, 0x0800, true);
    lh.setUint16(12, 0x21, true);
    lh.setUint32(14, crc, true);
    lh.setUint32(18, a.dados.length, true);
    lh.setUint32(22, a.dados.length, true);
    lh.setUint16(26, nome.length, true);
    partes.push(new Uint8Array(lh.buffer), nome, a.dados);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true);
    ch.setUint16(4, 20, true);
    ch.setUint16(6, 20, true);
    ch.setUint16(8, 0x0800, true);
    ch.setUint16(14, 0x21, true);
    ch.setUint32(16, crc, true);
    ch.setUint32(20, a.dados.length, true);
    ch.setUint32(24, a.dados.length, true);
    ch.setUint16(28, nome.length, true);
    ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), nome);
    offset += 30 + nome.length + a.dados.length;
  });
  const cdTam = central.reduce((s, p) => s + p.length, 0);
  const eo = new DataView(new ArrayBuffer(22));
  eo.setUint32(0, 0x06054b50, true);
  eo.setUint16(8, arquivos.length, true);
  eo.setUint16(10, arquivos.length, true);
  eo.setUint32(12, cdTam, true);
  eo.setUint32(16, offset, true);
  const todas = partes.concat(central, [new Uint8Array(eo.buffer)]);
  const out = new Uint8Array(todas.reduce((s, p) => s + p.length, 0));
  let o = 0;
  todas.forEach((p) => {
    out.set(p, o);
    o += p.length;
  });
  return out;
}
function xmlEsc(s) {
  return String(s)
    .replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g, "")
    .replace(/&/g, "&amp;")

    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function celulaXlsx(ref, v, tipo) {
  if (v === null || v === undefined || v === "") return "";
  if (tipo === "num0") {
    const d = String(v).replace(/\D/g, "");
    if (d) return `<c r="${ref}" s="1"><v>${d}</v></c>`;
  }
  if (tipo === "numtxt" && /^(0|[1-9]\d*)([.,]\d+)?$/.test(String(v).trim())) {
    return `<c r="${ref}"><v>${Number(String(v).trim().replace(",", "."))}</v></c>`;
  }
  return `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`;
}

    arq("_rels/.rels", `${X}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${REL}/officeDocument" Target="xl/workbook.xml"/></Relationships>`),
    arq("xl/workbook.xml", `${X}<workbook xmlns="${NS}" xmlns:r="${REL}"><sheets><sheet name="Relatorio" sheetId="1" r:id="rId1"/></sheets></workbook>`),
    arq("xl/_rels/workbook.xml.rels", `${X}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${REL}/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="${REL}/styles" Target="styles.xml"/></Relationships>`),
    arq("xl/styles.xml", `${X}<styleSheet xmlns="${NS}"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="1" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`),
    arq("xl/worksheets/sheet1.xml", `${X}<worksheet xmlns="${NS}"><cols><col min="1" max="1" width="20" customWidth="1"/><col min="2" max="${cabecalho.length}" width="16" customWidth="1"/></cols><sheetData>${cab}${corpo}</sheetData></worksheet>`),

// Uma linha por medicamento aplicado. SISBOV só com dígitos (número).
function linhasRelatorio(lancamentos) {
  const linhas = [];
  lancamentos
    .slice()
    .sort((a, b) => (a.data || "").localeCompare(b.data || ""))
    .forEach((l) => {
      const meds = l.medicamentos && l.medicamentos.length > 0 ? l.medicamentos : [{ medicamento: "", ml: "", lote: "" }];
      meds.forEach((m) => {
        linhas.push([
          String(l.sisbov == null ? "" : l.sisbov).replace(/\D/g, ""),
          m.medicamento, m.ml, l.motivo, fmtDate(l.data), m.lote, l.modalidade, l.responsavel, l.protocolo, l.temperatura, l.destino,
        ]);
      });
    });
  return linhas;
}

async function shareOrDownloadBlob(filename, blob) {
  try {
    if (navigator.canShare && navigator.share) {
      const file = new File([blob], filename, { type: blob.type });
      if (navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: filename });
        return { ok: true, method: "share" };
      }
    }
  } catch (e) {
    if (e && e.name === "AbortError") return { ok: true, method: "cancelled" };
  }
  try {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    return { ok: true, method: "download" };
  } catch (e) {
    return { ok: false, method: "none" };
  }
}

async function shareOrDownloadFile(filename, content, mime = "text/csv;charset=utf-8;") {
  const withBom = "\uFEFF" + content;

  try {
    if (navigator.canShare && navigator.share) {
      const file = new File([withBom], filename, { type: mime });
      if (navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: filename });
        return { ok: true, method: "share" };
      }
    }
  } catch (e) {
    if (e && e.name === "AbortError") return { ok: true, method: "cancelled" };
  }

  try {
    const blob = new Blob([withBom], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    return { ok: true, method: "download" };
  } catch (e) {
    return { ok: false, method: "none", content };
  }
}

      </Field>

      <SectionTitle>Medicamentos aplicados</SectionTitle>
      {slots.map((slot, i) => (

      {slots.length < 3 && (
        <button

          style={{
            display: "flex",
            alignItems: "center",
            gap: 6,
            background: "transparent",

// Pesquisa rápida por manejo (mesma lógica da aba Lançar: busca pelos
// últimos dígitos sem exigir o dígito verificador; se houver mais de um
// animal com esses dígitos, o usuário escolhe qual). Junta os lançamentos do
// app com o histórico de sanidade importado.
function QuickAnimalSearch({ lancamentos, sanidade }) {
  const [query, setQuery] = useState("");
  const [selectedSisbov, setSelectedSisbov] = useState(null);
  const [show, setShow] = useState(false);

  const digits = query.replace(/\D/g, "");
  const histKeys = useMemo(() => (sanidade ? Object.keys(sanidade.byAnimal) : []), [sanidade]);

  const matches = useMemo(() => {
    if (digits.length < 5) return [];
    const test = (s) => (digits.length >= 15 ? s === digits : s.endsWith(digits));
    const found = [];
    const seen = new Set();
    lancamentos.forEach((l) => {
      if (l.sisbov && !seen.has(l.sisbov) && test(l.sisbov)) {
        seen.add(l.sisbov);
        found.push(l.sisbov);
      }
    });
    histKeys.forEach((s) => {
      if (!seen.has(s) && test(s)) {
        seen.add(s);
        found.push(s);
      }
    });
    return found;
  }, [lancamentos, histKeys, digits]);

  const effectiveSisbov = matches.length === 1 ? matches[0] : selectedSisbov;
  const stats = useMemo(
    () => (effectiveSisbov ? computeAnimalStats(effectiveSisbov, lancamentos, sanidade) : null),
    [lancamentos, sanidade, effectiveSisbov]
  );

  return (
    <Card style={{ marginBottom: 14 }}>
      <div
        style={{ display: "flex", justifyContent: "space-between", alignItems: "center", cursor: "pointer" }}
        onClick={() => setShow(!show)}
      >
        <div style={{ display: "flex", alignItems: "center", gap: 8, fontWeight: 700, fontSize: 14 }}>
          <Search size={16} color="#2E4A2B" /> Pesquisa rápida por animal
        </div>
        {show ? <ChevronUp size={16} color="#9C9A88" /> : <ChevronDown size={16} color="#9C9A88" />}
      </div>

      {show && (
        <div style={{ marginTop: 12, paddingTop: 12, borderTop: "1px solid #EDEBDD" }}>
          <Field label="Número de manejo" hint="Com o dígito verificador (último número) — se houver mais de um animal, você escolhe qual">
            <TextInput
              inputMode="numeric"
              placeholder="Ex: 6747453"
              value={query}
              onChange={(e) => {
                setQuery(e.target.value.replace(/[^\d]/g, ""));
                setSelectedSisbov(null);
              }}
            />
          </Field>

          {digits.length >= 5 && matches.length === 0 && (
            <div style={{ fontSize: 12.5, color: "#A9A791" }}>Nenhuma medicação encontrada para esse número.</div>
          )}

          {matches.length > 1 && (
            <div style={{ marginBottom: 4 }}>
              <div style={{ fontSize: 12, color: "#B5442E", fontWeight: 700, marginBottom: 6, display: "flex", alignItems: "center", gap: 5 }}>
                <AlertCircle size={13} /> {matches.length} animais encontrados com esses números.{" "}
                {matches.length > 30 ? "Mostrando 30 — digite mais números. " : ""}Escolha qual:
              </div>
              {matches.slice(0, 30).map((s) => (
                <button
                  key={s}
                  type="button"
                  onClick={() => setSelectedSisbov(s)}
                  style={{
                    display: "flex",
                    alignItems: "center",
                    width: "100%",
                    boxSizing: "border-box",
                    background: effectiveSisbov === s ? "#EAF3DE" : "#FFFFFF",
                    border: effectiveSisbov === s ? "1.5px solid #639922" : "1px solid #E3E1D3",
                    borderRadius: 10,
                    padding: "9px 12px",
                    marginBottom: 6,
                    cursor: "pointer",
                    fontFamily: "inherit",
                    textAlign: "left",
                  }}
                >
                  <EarTag>{s}</EarTag>
                </button>
              ))}
            </div>
          )}

          {stats && (
            <div style={{ marginTop: 10, paddingTop: 10, borderTop: "1px solid #EDEBDD" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4, flexWrap: "wrap" }}>
                <EarTag>{effectiveSisbov}</EarTag>
                <span style={{ fontWeight: 800, fontSize: 14, color: "#20241A" }}>
                  {stats.total.toLocaleString("pt-BR")} {stats.total === 1 ? "medicação registrada" : "medicações registradas"}
                </span>
              </div>
              <div style={{ fontSize: 11.5, color: "#9C9A88", marginBottom: 8 }}>
                {stats.nTrat} tratamento{stats.nTrat === 1 ? "" : "s"} · {stats.nProt} de protocolo sanitário
                {stats.nHist > 0 ? ` · ${stats.nHist} vinda${stats.nHist === 1 ? "" : "s"} do histórico importado` : ""}
              </div>
              <MotivoRows itens={stats.tratamentos} />
              {stats.protocolos.length > 0 && <ProtocoloTitulo />}
              <MotivoRows itens={stats.protocolos} muted />
              {stats.ultimo && (
                <div style={{ fontSize: 11.5, color: "#9C9A88", marginTop: 8 }}>
                  Última aplicação em {fmtDate(stats.ultimo.iso)} · {motivoNome(stats.ultimo.motivo)}
                </div>
              )}
            </div>
          )}
        </div>
      )}
    </Card>
  );
}

function MedicamentoReport({ lancamentos, medicamentos, sanidade }) {
  const [selecionado, setSelecionado] = useState(""); // nome normalizado
  const [show, setShow] = useState(false);

  const options = useMemo(() => {
    const map = new Map();
    medicamentos.forEach((m) => {
      const k = normKey(m.nome);
